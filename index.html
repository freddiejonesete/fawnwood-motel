<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fawnwood Staff</title>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f2;
      color: #24352c;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e3e5df;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #7b827d;
      font-size: 13px;
      margin-top: 3px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 22px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .add-button {
      border: 0;
      background: #234c38;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-button:hover {
      background: #193b2b;
    }

    .status {
      margin-bottom: 20px;
      padding: 12px 15px;
      border-radius: 9px;
      background: #ffffff;
      border: 1px solid #e3e5df;
      color: #66706a;
      font-size: 14px;
    }

    .profiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .empty {
      background: white;
      border: 1px dashed #cfd4ce;
      border-radius: 14px;
      padding: 55px 25px;
      text-align: center;
      color: #7d847f;
      grid-column: 1 / -1;
    }

    .empty-title {
      color: #344239;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .card {
      background: white;
      border: 1px solid #e1e4df;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.03);
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #dfe8df;
      color: #234c38;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .name {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .username {
      color: #858d87;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .role {
      display: inline-block;
      background: #edf2ed;
      color: #31513e;
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 600;
      margin: 3px 3px 3px 0;
    }

    .active {
      margin-top: 15px;
      font-size: 12px;
      color: #39704e;
      font-weight: 600;
    }

    .inactive {
      margin-top: 15px;
      font-size: 12px;
      color: #9a6a55;
      font-weight: 600;
    }

    .modal-background {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 470px;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.15);
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #465149;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5dad5;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #315c43;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .cancel {
      flex: 1;
      border: 1px solid #d6dad6;
      background: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .save {
      flex: 1;
      border: 0;
      background: #234c38;
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .error {
      color: #a1493d;
      background: #fff1ef;
      border: 1px solid #f0d0cb;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      .container {
        padding: 25px 15px;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <div class="brand">fawnwood</div>
    <div class="subtitle">Staff Management</div>
  </div>
</header>

<main class="container">

  <div class="top">
    <div>
      <h1>Staff Profiles</h1>
    </div>

    <button class="add-button" onclick="openModal()">
      + Add profile
    </button>
  </div>

  <div id="status" class="status">
    Connecting to staff database...
  </div>

  <div id="profiles" class="profiles">
    <div class="empty">
      <div class="empty-title">Loading profiles...</div>
      Please wait.
    </div>
  </div>

</main>


<!-- ADD PROFILE MODAL -->

<div id="modalBackground" class="modal-background">

  <div class="modal">

    <h2>Add staff profile</h2>

    <div id="error" class="error"></div>

    <label>Name</label>
    <input
      id="name"
      type="text"
      placeholder="e.g. Freddie Jones"
    >

    <label>Username</label>
    <input
      id="username"
      type="text"
      placeholder="e.g. freddie"
    >

    <label>Role</label>
    <input
      id="role"
      type="text"
      placeholder="e.g. Receptionist"
    >

    <div class="modal-buttons">

      <button class="cancel" onclick="closeModal()">
        Cancel
      </button>

      <button class="save" onclick="addProfile()">
        Create profile
      </button>

    </div>

  </div>

</div>


<script>

  /*
   ============================================================
   SUPABASE CONNECTION
   ============================================================
  */

  const SUPABASE_URL =
    "https://flusfabvilrygloxwnef.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_OliUYp5BG0wZdRGAsPv_2g_kAicECMx";


  /*
   ============================================================
   CONNECT TO SUPABASE
   ============================================================
  */

  let db = null;
  let demoMode = false;

  try {

    if (
      window.supabase &&
      typeof window.supabase.createClient === "function"
    ) {

      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    } else {

      demoMode = true;

    }

  } catch (error) {

    console.log("Supabase unavailable:", error);
    demoMode = true;

  }


  /*
   ============================================================
   DEMO DATA
   Used only if the ChatGPT preview cannot load Supabase.
   ============================================================
  */

  let demoProfiles = [];


  /*
   ============================================================
   LOAD PROFILES
   ============================================================
  */

  async function loadProfiles() {

    const profilesElement =
      document.getElementById("profiles");

    const status =
      document.getElementById("status");


    /*
      CHATGPT PREVIEW MODE
    */

    if (demoMode) {

      status.innerHTML =
        "Preview mode — Supabase will connect on your GitHub website.";

      renderProfiles(demoProfiles);

      return;

    }


    /*
      REAL SUPABASE
    */

    status.innerHTML =
      "Loading staff profiles...";


    try {

      const result = await db
        .from("staff")
        .select("*")
        .order("created_at", {
          ascending: false
        });


      if (result.error) {
        throw result.error;
      }


      renderProfiles(result.data || []);


      status.innerHTML =
        "Connected to Supabase";


    } catch (error) {

      console.error(error);

      status.innerHTML =
        "Could not load profiles from Supabase.";

      profilesElement.innerHTML = `
        <div class="empty">
          <div class="empty-title">
            Couldn't load staff profiles
          </div>

          Check your Supabase table permissions.
        </div>
      `;

    }

  }


  /*
   ============================================================
   DISPLAY PROFILES
   ============================================================
  */

  function renderProfiles(profiles) {

    const container =
      document.getElementById("profiles");


    if (!profiles || profiles.length === 0) {

      container.innerHTML = `
        <div class="empty">

          <div class="empty-title">
            No staff profiles yet
          </div>

          Click "Add profile" to create your first one.

        </div>
      `;

      return;

    }


    container.innerHTML = profiles.map(profile => {

      const name =
        profile.name || "Unnamed";

      const username =
        profile.username || "";

      const role =
        profile.role || "No role";

      const initials =
        name
          .split(" ")
          .map(word => word[0])
          .join("")
          .substring(0, 2)
          .toUpperCase();


      return `

        <div class="card">

          <div class="avatar">
            ${escapeHTML(initials)}
          </div>

          <div class="name">
            ${escapeHTML(name)}
          </div>

          <div class="username">
            @${escapeHTML(username)}
          </div>

          <div>

            <span class="role">
              ${escapeHTML(role)}
            </span>

          </div>

          ${
            profile.active
              ? `<div class="active">● Active</div>`
              : `<div class="inactive">● Inactive</div>`
          }

        </div>

      `;

    }).join("");

  }


  /*
   ============================================================
   ADD PROFILE
   ============================================================
  */

  async function addProfile() {

    const name =
      document.getElementById("name").value.trim();

    const username =
      document.getElementById("username").value.trim();

    const role =
      document.getElementById("role").value.trim();

    const error =
      document.getElementById("error");


    error.style.display = "none";


    if (!name || !username || !role) {

      error.innerText =
        "Please fill in all three fields.";

      error.style.display = "block";

      return;

    }


    /*
      CHATGPT PREVIEW MODE
    */

    if (demoMode) {

      demoProfiles.unshift({

        id: Date.now(),

        name: name,

        username: username,

        role: role,

        active: true,

        created_at:
          new Date().toISOString()

      });


      closeModal();

      clearForm();

      renderProfiles(demoProfiles);

      return;

    }


    /*
      REAL SUPABASE
    */

    try {

      const result = await db
        .from("staff")
        .insert({

          name: name,

          username: username,

          role: role,

          active: true

        })
        .select();


      if (result.error) {
        throw result.error;
      }


      closeModal();

      clearForm();

      await loadProfiles();


    } catch (err) {

      console.error(err);

      error.innerText =
        "Could not create the profile. Check your Supabase permissions.";

      error.style.display =
        "block";

    }

  }


  /*
   ============================================================
   MODAL
   ============================================================
  */

  function openModal() {

    document.getElementById(
      "modalBackground"
    ).style.display = "flex";

  }


  function closeModal() {

    document.getElementById(
      "modalBackground"
    ).style.display = "none";

    document.getElementById(
      "error"
    ).style.display = "none";

  }


  function clearForm() {

    document.getElementById("name").value = "";

    document.getElementById("username").value = "";

    document.getElementById("role").value = "";

  }


  /*
   ============================================================
   SECURITY
   ============================================================
  */

  function escapeHTML(value) {

    return String(value)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }


  /*
   ============================================================
   START APP
   ============================================================
  */

  loadProfiles();

</script>

</body>
</html>
