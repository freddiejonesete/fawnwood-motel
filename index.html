<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#193b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Fawnwood Hotel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   FAWNWOOD HOTEL
   iPHONE-FIRST HOTEL OPERATIONS SYSTEM
   ========================================================= */

:root {
    --forest:#193b2b;
    --forest-2:#28533d;
    --forest-3:#3e6a50;
    --sage:#e6eee7;
    --cream:#f5f4ef;
    --paper:#ffffff;
    --text:#1e2a23;
    --muted:#758078;
    --line:#dfe5df;
    --danger:#a64b43;
    --warning:#a57836;
    --success:#3c7650;
    --shadow:0 5px 25px rgba(25,59,43,.08);
    --radius:16px;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body {
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--cream);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
}

body {
    min-height:100vh;
    padding-bottom:calc(92px + env(safe-area-inset-bottom));
}

button,
input,
select,
textarea {
    font:inherit;
}

button {
    cursor:pointer;
}

input,
select,
textarea {
    width:100%;
    border:1px solid var(--line);
    background:white;
    border-radius:12px;
    padding:13px 14px;
    color:var(--text);
    outline:none;
}

input:focus,
select:focus,
textarea:focus {
    border-color:var(--forest-3);
    box-shadow:0 0 0 3px rgba(62,106,80,.10);
}

textarea {
    min-height:110px;
    resize:vertical;
}

button:disabled {
    opacity:.5;
    pointer-events:none;
}

/* =========================================================
   APP
   ========================================================= */

#app {
    min-height:100vh;
}

.hidden {
    display:none !important;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
    padding:
        max(14px,env(safe-area-inset-top))
        16px
        13px;
}

.topbar-inner {
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand {
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-mark {
    width:39px;
    height:39px;
    border-radius:12px;
    background:var(--forest);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:800;
    font-size:18px;
}

.brand-title {
    font-weight:800;
    font-size:17px;
    line-height:1.1;
}

.brand-subtitle {
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.icon-button {
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:12px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--forest);
    font-size:19px;
}

/* =========================================================
   MAIN
   ========================================================= */

.page {
    max-width:1200px;
    margin:auto;
    padding:20px 16px 35px;
}

.page-title {
    font-size:28px;
    font-weight:800;
    letter-spacing:-.7px;
    margin:3px 0 5px;
}

.page-description {
    color:var(--muted);
    font-size:14px;
    margin-bottom:22px;
}

.section-title {
    font-size:17px;
    font-weight:750;
    margin:25px 0 12px;
}

/* =========================================================
   CARDS
   ========================================================= */

.card {
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

.card-pad {
    padding:17px;
}

.grid {
    display:grid;
    gap:12px;
}

.grid-2 {
    grid-template-columns:1fr 1fr;
}

.grid-3 {
    grid-template-columns:repeat(3,1fr);
}

@media(min-width:760px) {
    .grid-4 {
        grid-template-columns:repeat(4,1fr);
    }
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn {
    border:0;
    border-radius:12px;
    min-height:45px;
    padding:11px 16px;
    font-weight:700;
    display:inline-flex;
    align-items:center;

.btn-secondary {

/* =========================================================

.feature-card {

/* =========================================================

.stat-grid {

.stat {

.stat-value {

   ========================================================= */

}

.room {

.room-number {

}

.room-type {

    color:var(--muted);

}

.room-status {

}

.room.available {

}

.room.available .room-status {

}

.room.occupied {
    border-color:#d6c4a4;

.room.cleaning {

}

}

.room.maintenance {
    border-color:#e1bbbb;

}

.room.maintenance .room-status {
    color:var(--danger);
}

@media(min-width:700px) {
    .room-map {
        grid-template-columns:repeat(6,1fr);
    }
}

/* =========================================================
   BADGES
   ========================================================= */

.badge {
    display:inline-flex;
    align-items:center;
    padding:5px 8px;
    border-radius:7px;
    font-size:10px;
    font-weight:750;
}

.badge-green {
    background:#e6f1e8;
    color:var(--success);
}

.badge-yellow {
    background:#f5eddd;
    color:#956e2f;
}

.badge-blue {
    background:#e5edf5;
    color:#4c6c89;
}

.badge-red {

}

/* =========================================================
   FORMS
   ========================================================= */

.form-group {

}

.form-label {
    display:block;

.form-help {

    gap:10px;

/* =========================================================

.list {

.list-item {

.list-row {

.list-title {

    margin-top:4px;

/* =========================================================

.login-screen {
    min-height:100vh;

    justify-content:center;

.profile-login-name {

/* =========================================================

.bottom-nav {

.nav-button {

/* =========================================================

/* =========================================================

<body>

<div id="app"></div>
<div id="toast">
    <div class="toast-inner" id="toastText"></div>
</div>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://flusfabvilrygloxwnef.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OliUYp5BG0wZdRGAsPv_2g_kAicECMx";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   APPLICATION STATE
   ========================================================= */

const state = {
    staff:null,
    page:"home",
    rooms:[],
    roomTypes:[],
    bookings:[],
    guests:[],
    payments:[],
    service:[],
    housekeeping:[],
    issues:[],
    settings:{},
    cleaningGuide:[],
    loading:false
};


/* =========================================================
   UTILITY
   ========================================================= */

function esc(value) {

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function initials(name) {

    return String(name || "?")
        .split(" ")
        .map(x => x[0])
        .join("")
        .slice(0,2)
        .toUpperCase();
}


function money(value) {

    return `${Number(value || 0).toLocaleString()} B$`;
}


function dateOnly(date) {

    if(!date) return "";

    return new Date(date).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}


function nightsBetween(start,end) {

    const a =
        new Date(start);

    const b =
        new Date(end);

    return Math.max(
        1,
        Math.ceil(
            (b-a)/(1000*60*60*24)
        )
    );
}


function toast(message) {

    const box =
        document.getElementById("toast");

    const text =
        document.getElementById("toastText");

    text.textContent = message;

    box.classList.add("show");

    setTimeout(
        () => box.classList.remove("show"),
        2800
    );
}


/* =========================================================
   SAFE DATABASE ERROR HANDLING
   ========================================================= */

function databaseError(error) {

    console.error(error);

    /*
       IMPORTANT:
       There are deliberately NO "Cannot connect to Supabase"
       popups or alert() calls anywhere in this application.

       Database errors are displayed inline or through a small
       non-blocking toast.
    */

    if(!error)
        return "The request could not be completed.";

    if(error.code === "42501")
        return "You do not have permission to perform this action.";

    if(error.code === "23505")
        return "That record already exists.";

    if(error.code === "23503")
        return "This record is linked to another part of the hotel.";

    return error.message ||
        "The request could not be completed.";
}


/* =========================================================
   GENERIC DATABASE HELPERS
   ========================================================= */

async function selectTable(table, options={}) {

    let query =
        db.from(table).select(options.select || "*");

    if(options.eq) {

        for(const [key,value] of Object.entries(options.eq)) {
            query = query.eq(key,value);
        }
    }

    if(options.order) {

        query =
            query.order(
                options.order,
                {
                    ascending:
                        options.ascending ?? false
                }
            );
    }

    if(options.limit) {
        query = query.limit(options.limit);
    }

    return await query;
}


async function insertRow(table,row) {

    return await db
        .from(table)
        .insert(row)
        .select()
        .single();
}


async function updateRow(table,id,row) {

    return await db
        .from(table)
        .update(row)
        .eq("id",id)
        .select()
        .single();
}


async function deleteRow(table,id) {

    return await db
        .from(table)
        .delete()
        .eq("id",id);
}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadDatabase() {

    state.loading = true;

    const results =
        await Promise.all([
            selectTable("rooms",{order:"room_number",ascending:true}),
            selectTable("room_types",{order:"name",ascending:true}),
            selectTable("bookings",{order:"created_at"}),
            selectTable("guests",{order:"created_at"}),
            selectTable("payments",{order:"created_at"}),
            selectTable("room_service",{order:"created_at"}),
            selectTable("housekeeping",{order:"created_at"}),
            selectTable("maintenance_issues",{order:"created_at"}),
            selectTable("settings"),
            selectTable("cleaning_guide",{order:"sort_order",ascending:true})
        ]);

    state.rooms =
        results[0].error ? [] : results[0].data || [];

    state.roomTypes =
        results[1].error ? [] : results[1].data || [];

    state.bookings =
        results[2].error ? [] : results[2].data || [];

    state.guests =
        results[3].error ? [] : results[3].data || [];

    state.payments =
        results[4].error ? [] : results[4].data || [];

    state.service =
        results[5].error ? [] : results[5].data || [];

    state.housekeeping =
        results[6].error ? [] : results[6].data || [];

    state.issues =
        results[7].error ? [] : results[7].data || [];

    state.settings =
        results[8].error ? {} :
        Object.fromEntries(
            (results[8].data || [])
            .map(x => [x.key,x.value])
        );

async function loginAs(id) {

    const profile =
        state._profiles?.find(x => x.id === id);

    if(profile) {

        state.staff = profile;

    } else {

        const result =
            await selectTable(
                "staff",
                {
                    eq:{id}
                }
            );

        if(result.error || !result.data?.length) {

            const error =
                document.getElementById("loginError");

            error.textContent =
                databaseError(result.error);

            error.classList.add("show");

            return;
        }

        state.staff =
            result.data[0];
    }

    await startApplication();
}


/* =========================================================
   START APPLICATION
   ========================================================= */

async function startApplication() {

    localStorage.setItem(
        "fawnwood_staff_id",
        state.staff.id
    );

    await loadDatabase();

    renderApp();
}


/* =========================================================
   SESSION RESTORE
   ========================================================= */

async function restoreSession() {

    const id =
        localStorage.getItem(
            "fawnwood_staff_id"
        );

    if(!id) {

        const result =
            await selectTable(
                "staff",
                {
                    order:"name",
                    ascending:true
                }
            );

        state._profiles =
            result.data || [];

        await loadLogin();

        return;
    }

    const result =
        await selectTable(
            "staff",
            {
                eq:{id}
            }
        );

    if(result.data?.length) {

        state.staff =
            result.data[0];

        await startApplication();

    } else {

        localStorage.removeItem(
            "fawnwood_staff_id"
        );

        await restoreSession();
    }
}


/* =========================================================

   ========================================================= */

function isManager() {

    if(!state.staff)
        return false;

    const roles =
        Array.isArray(state.staff.roles)
        ? state.staff.roles
        : [state.staff.role];

    return roles.some(role =>
        String(role || "")
        .toLowerCase()
        .includes("manager")
    );
}


function requireManager(action) {

    if(isManager())
        return true;

    toast(
        `Manager permission required to ${action}.`
    );

    return false;
}

async function navigate(page) {

    state.page = page;

    const main =
        document.getElementById("main");

    if(!main)
        return;

    document
        .querySelectorAll(".nav-button")
        .forEach(button => {
            button.classList.remove("active");
        });

    const button =
        [...document.querySelectorAll(".nav-button")]
        .find(x =>
            x.getAttribute("onclick")
            ?.includes(`'${page}'`)
        );

    if(button)
        button.classList.add("active");

    switch(page) {

        case "home":
            renderHome();
            break;

        case "checkin":
            renderCheckin();
            break;

        case "rooms":
            renderRooms();
            break;

        case "amenities":
            renderAmenities();
            break;

        case "more":
            renderMore();
            break;

        default:
            renderHome();
    }
}

/* =========================================================
   CHECK-IN CALCULATIONS
   ========================================================= */

function calculateCheckin() {

    const nights =
        Math.max(
            1,
            Number(
                document.getElementById("nightCount")?.value || 1
            )
        );

    const roomTypeId =
        document.getElementById("roomType")?.value;

    const board =
        document.getElementById("boardBasis")?.value;

    const type =
        state.roomTypes.find(
            x => x.id === roomTypeId
        );

    if(!type) {

        const roomResult =
            document.getElementById("roomResult");

        if(roomResult) {

            roomResult.innerHTML = `
                <div class="list-title">
                    Select a room type
                </div>

                <div class="list-subtitle">
                    The system will find a suitable
                    available room.
                </div>
            `;
        }

        return;
    }

    const available =
        state.rooms.find(
            room =>
                room.room_type_id === roomTypeId &&
                room.status === "available"
        );

    const roomResult =
        document.getElementById("roomResult");

    if(available) {

        roomResult.innerHTML = `

            <div class="badge badge-green">
                ROOM AVAILABLE
            </div>

            <div style="
                font-weight:800;
                margin-top:8px">

                Room ${esc(available.room_number)}

            </div>

            <div class="list-subtitle">
                ${esc(available.room_name || "")}
            </div>
        `;

    } else {

        roomResult.innerHTML = `

            <div class="badge badge-red">
                NO ROOM AVAILABLE
            </div>

            <div class="list-subtitle"
                 style="margin-top:7px">

                There are currently no available
                rooms of this type.

            </div>
        `;
    }

    let nightly =
        Number(type.price_per_night || 0);

    if(board === "bnb")
        nightly += Number(type.bnb_supplement || 0);

    if(board === "bnb_evening")
        nightly +=
            Number(type.bnb_supplement || 0) +
            Number(type.evening_meal_supplement || 0);

    const total =
        nightly * nights;

    const totalBox =
        document.getElementById("checkinTotal");

    if(totalBox) {

        totalBox.innerHTML = `

            <div class="list-row">

                <div>
                    <div class="list-title">
                        Stay total
                    </div>

                    <div class="list-subtitle">
                        ${nights} night${nights === 1 ? "" : "s"}
                        · ${esc(type.name)}
                        · ${esc(boardLabel(board))}
                    </div>
                </div>

                <strong style="font-size:19px">
                    ${money(total)}
                </strong>

            </div>

        `;
    }

    const checkin =
        document.getElementById("ciDate")?.value;

    const checkout =
        document.getElementById("coDate");

    if(checkin && checkout) {

        const d =
            new Date(checkin);

        d.setDate(
            d.getDate() + nights
        );

        checkout.value =
            d.toISOString().slice(0,10);
    }
}


function boardLabel(board) {

    if(board === "bnb")
        return "B&B";

    if(board === "bnb_evening")
        return "B&B + Evening Meal";

    return "Room Only";
}

function checkPreviousCustomer() {

        document.getElementById("guestUsername")?.value

    const previous =
        state.guests.find(guest => {

                name &&
                String(guest.name || "")
                    .toLowerCase() === name;

            const sameUsername =
                username &&
                String(guest.username || "")
                    .toLowerCase() === username;

            return sameName || sameUsername;
        });

    if(!previous) {

        box.innerHTML = "";
        return;
    }

    box.innerHTML = `

            <strong>
                Previous customer

            <div style="margin-top:3px">

/* =========================================================
   COMPLETE CHECK-IN
   ========================================================= */

async function completeCheckin() {

    const errorBox =
        document.getElementById("checkinError");

    errorBox.classList.remove("show");

    const name =
        document.getElementById("guestName").value.trim();

    const username =
        document.getElementById("guestUsername").value.trim();

    const roomTypeId =
        document.getElementById("roomType").value;

    const room =
        state.rooms.find(
            r =>
                r.room_type_id === roomTypeId &&
                r.status === "available"
        );

    const checkin =
        document.getElementById("ciDate").value;

    const checkout =
        document.getElementById("coDate").value;

    const board =
        document.getElementById("boardBasis").value;

    const nights =
        Number(
            document.getElementById("nightCount").value
        );

    const allowance =
        Number(
            document.getElementById("roomServiceAllowance").value || 0
        );

    if(!name) {

        errorBox.textContent =
            "Please enter the guest's name.";

        errorBox.classList.add("show");

        return;
    }

    if(!roomTypeId || !room) {

        errorBox.textContent =
            "No available room has been selected.";

        errorBox.classList.add("show");

        return;
    }

    const type =
        state.roomTypes.find(
            x => x.id === roomTypeId
        );

    let nightly =
        Number(type.price_per_night || 0);

    if(board === "bnb")
        nightly += Number(type.bnb_supplement || 0);

    if(board === "bnb_evening")
        nightly +=
            Number(type.bnb_supplement || 0) +
            Number(type.evening_meal_supplement || 0);

    const total =
        nightly * nights;

    try {

        let guest =
            state.guests.find(g => {

                const sameName =
                    String(g.name || "")
                    .toLowerCase() ===
                    name.toLowerCase();

                const sameUsername =
                    username &&
                    String(g.username || "")
                    .toLowerCase() ===
                    username.toLowerCase();

                return sameName || sameUsername;
            });

        if(!guest) {

            const guestResult =
                await insertRow(
                    "guests",
                    {
                        title:
                            document.getElementById("guestTitle").value,

                        name,

                        username:
                            username || null
                    }
                );

            if(guestResult.error)
                throw guestResult.error;

            guest =
                guestResult.data;

        } else {

            const update =
                await updateRow(
                    "guests",
                    guest.id,
                    {
                        last_visit:
                            new Date().toISOString()
                    }
                );

            if(update.error)
                throw update.error;
        }

        const bookingResult =
            await insertRow(
                "bookings",
                {
                    guest_id:guest.id,
                    room_id:room.id,
                    check_in:checkin,
                    check_out:checkout,
                    nights,
                    board_basis:board,
                    room_price:total,
                    room_service_allowance:allowance,
                    status:"checked_in",
                    created_by:state.staff.id
                }
            );

        if(bookingResult.error)
            throw bookingResult.error;

        const paymentResult =
            await insertRow(
                "payments",
                {
                    booking_id:
                        bookingResult.data.id,

                    guest_id:
                        guest.id,

                    amount:
                        total,

                    payment_method:
                        document.getElementById("paymentMethod").value,

                    status:"paid",

                    taken_by:
                        state.staff.id
                }
            );

        if(paymentResult.error)
            throw paymentResult.error;

        const roomUpdate =
            await updateRow(
                "rooms",
                room.id,
                {
                    status:"occupied",
                    current_booking_id:
                        bookingResult.data.id
                }
            );

        if(roomUpdate.error)
            throw roomUpdate.error;

        await loadDatabase();

        toast(
            `Room ${room.room_number} checked in successfully.`
        );

        navigate("rooms");

    } catch(error) {

        errorBox.textContent =
            databaseError(error);

        errorBox.classList.add("show");
    }
}

/* =========================================================
   CHECKOUT
   ========================================================= */

async function checkoutGuest(bookingId) {

    const booking =
        state.bookings.find(
            x => x.id === bookingId
        );

    if(!booking)
        return;

    const room =
        state.rooms.find(
            x => x.id === booking.room_id
        );

    const result =
        await updateRow(
            "bookings",
            booking.id,
            {
                status:"checked_out",
                checked_out_at:
                    new Date().toISOString()
            }
        );

    if(result.error) {

        toast(
            databaseError(result.error)
        );

        return;
    }

    if(room) {

        const roomResult =
            await updateRow(
                "rooms",
                room.id,
                {
                    status:"cleaning",
                    current_booking_id:null
                }
            );

        if(roomResult.error) {

            toast(
                databaseError(roomResult.error)
            );

            return;
        }

        await insertRow(
            "housekeeping",
            {
                room_id:room.id,
                booking_id:booking.id,
                status:"pending",
                created_by:state.staff.id
            }
        );
    }

    closeSheet();

    await loadDatabase();

    renderRooms();

    toast(
        "Guest checked out. Room sent to housekeeping."
    );
}

async function completeCleaning(id) {

    const checks =
        [...document.querySelectorAll(".clean-check")];

    const error =
        document.getElementById("cleaningError");

    if(checks.some(x => !x.checked)) {

        error.textContent =
            "Complete every cleaning check before marking the room clean.";

        error.classList.add("show");

        return;
    }

    const task =
        state.housekeeping.find(
            x => x.id === id
        );

    if(!task)
        return;

    const result =
        await updateRow(
            "housekeeping",
            id,
            {
                status:"completed",
                completed_by:state.staff.id,
                completed_at:
                    new Date().toISOString()
            }
        );

    if(result.error) {

        error.textContent =
            databaseError(result.error);

        error.classList.add("show");

        return;
    }

    const roomResult =
        await updateRow(
            "rooms",
            task.room_id,
            {
                status:"available"
            }
        );

    if(roomResult.error) {

        error.textContent =
            databaseError(roomResult.error);

        error.classList.add("show");

        return;
    }

    closeSheet();

    await loadDatabase();

    navigate("rooms");

    toast("Room is now available.");
}

             style="margin-bottom:15px">
        </div>

        </button>

function calculateService() {

    const amount =
        Number(
            document.getElementById("serviceAmount")?.value || 0
        );

    const charge =
        Math.max(
            0,
            amount - 100
        );

    const box =
        document.getElementById("serviceCalculation");

    if(!box)
        return;

    box.innerHTML = `

        <div class="list-row">

            <div>
                <div class="list-title">
                    Guest allowance
                </div>

                <div class="list-subtitle">
                    First 100 B$ free
                </div>
            </div>

            <strong>
                ${money(Math.min(amount,100))}
            </strong>

        </div>

        <div class="list-row"
             style="margin-top:11px">

            <div>
                <div class="list-title">
                    Additional charge
                </div>

                <div class="list-subtitle">
                    Added to the guest's bill
                </div>
            </div>

            <strong>
                ${money(charge)}
            </strong>

        </div>

    `;
}


async function chargeRoomService() {

    const bookingId =
        document.getElementById("serviceBooking").value;

    const amount =
        Number(
            document.getElementById("serviceAmount").value || 0
        );

    const description =
        document.getElementById("serviceDescription").value.trim();

    const error =
        document.getElementById("serviceError");

    if(!bookingId) {

        error.textContent =
            "Select a customer.";

        error.classList.add("show");

        return;
    }

    const booking =
        state.bookings.find(
            x => x.id === bookingId
        );

    if(!booking)
        return;

    const free =
        Math.min(amount,100);

    const charge =
        Math.max(
            0,
            amount - 100
        );

    const result =
        await insertRow(
            "room_service",
            {
                booking_id:bookingId,
                guest_id:booking.guest_id,
                amount,
                free_amount:free,
                charged_amount:charge,
                description,
                taken_by:state.staff.id
            }
        );

    if(result.error) {

        error.textContent =
            databaseError(result.error);

        error.classList.add("show");

        return;
    }

    if(charge > 0) {

        const payment =
            await insertRow(
                "payments",
                {
                    booking_id:bookingId,
                    guest_id:booking.guest_id,
                    amount:charge,
                    payment_method:"room_service",
                    status:"pending",
                    taken_by:state.staff.id
                }
            );

        if(payment.error) {

            toast(
                databaseError(payment.error)
            );

            return;
        }
    }

    await loadDatabase();

    closeSheet();

    toast(
        `${money(amount)} room service recorded.`
    );
}

/* =========================================================
   CUSTOMERS
   ========================================================= */

function openCustomers() {

    showSheet(`

        <div class="sheet-header">

            <div class="sheet-title">
                Customers
            </div>

        </div>

        <div class="search">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="customerSearch"
                type="search"
                placeholder="Search customers"
                oninput="filterCustomers()">

        </div>

        <div id="customerList">
            ${customerRows(state.guests)}
        </div>

    `);
}


function customerRows(guests) {

    if(!guests.length) {

        return `

            <div class="card card-pad">
                No customers yet.
            </div>

        `;
    }

    return guests.map(guest => {

        const visits =
            state.bookings.filter(
                b =>
                    b.guest_id === guest.id
            ).length;

        return `

            <button
                class="card card-pad"
                style="
                    width:100%;
                    text-align:left;
                    margin-bottom:9px;
                    border:1px solid var(--line)"
                onclick="openCustomer('${guest.id}')">

                <div class="list-row">

                    <div>

                        <div class="list-title">
                            ${esc(guest.title || "")}
                            ${esc(guest.name)}
                        </div>

                        <div class="list-subtitle">
                            @${esc(guest.username || "")}
                        </div>

                    </div>

                    ${
                        visits > 1
                        ? `
                            <span class="badge badge-green">
                                Previous customer
                            </span>
                        `
                        : ""
                    }

                </div>

            </button>

        `;

    }).join("");
}


function filterCustomers() {

    const search =
        document.getElementById("customerSearch")
        ?.value
        .toLowerCase()
        .trim();

    const filtered =
        state.guests.filter(
            guest =>
                String(guest.name || "")
                    .toLowerCase()
                    .includes(search) ||
                String(guest.username || "")
                    .toLowerCase()
                    .includes(search)
        );

    document.getElementById("customerList").innerHTML =
        customerRows(filtered);
}


function openCustomer(id) {

    const guest =
        state.guests.find(
            x => x.id === id
        );

    if(!guest)
        return;

    const bookings =
        state.bookings.filter(
            b =>
                b.guest_id === id
        );

    const paid =
        state.payments
            .filter(
                p =>
                    p.guest_id === id &&
                    p.status === "paid"
            )
            .reduce(
                (sum,p) =>
                    sum + Number(p.amount || 0),
                0
            );

    showSheet(`

        <div class="sheet-header">

            <div class="sheet-title">
                Customer
            </div>

        </div>

        <div class="card card-pad">

            <div style="
                font-size:21px;
                font-weight:800">

                ${esc(guest.title || "")}
                ${esc(guest.name)}

            </div>

            <div class="list-subtitle">
                @${esc(guest.username || "")}
            </div>

            <div class="section-title">
                History
            </div>

            <div class="list-row">

                <div>
                    <div class="list-title">
                        Visits
                    </div>
                </div>

                <strong>
                    ${bookings.length}
                </strong>

            </div>

            <div class="list-row"
                 style="margin-top:12px">

                <div>
                    <div class="list-title">
                        Total paid
                    </div>
                </div>

                <strong>
                    ${money(paid)}
                </strong>

            </div>

        </div>

        <div class="section-title">
            Stays
        </div>

        ${
            bookings.map(booking => {

                const room =
                    state.rooms.find(
                        r => r.id === booking.room_id
                    );

                return `

                    <div class="card card-pad"
                         style="margin-bottom:9px">

                        <div class="list-title">
                            Room ${esc(room?.room_number || "")}
                        </div>

                        <div class="list-subtitle">
                            ${dateOnly(booking.check_in)}
                            →
                            ${dateOnly(booking.check_out)}
                        </div>

                        <div class="list-subtitle">
                            ${esc(boardLabel(booking.board_basis))}
                        </div>

                    </div>

                `;

            }).join("")
        }

    `);
}


/* =========================================================
   STATISTICS
   ========================================================= */

function openStatistics() {

    const revenue =
        state.payments
            .filter(
                p => p.status === "paid"
            )
            .reduce(
                (sum,p) =>
                    sum + Number(p.amount || 0),
                0
            );

    const occupied =
        state.rooms.filter(
            r => r.status === "occupied"
        ).length;

    const roomNights =
        state.bookings.reduce(
            (sum,b) =>
                sum + Number(b.nights || 0),
            0
        );

    const average =
        state.bookings.length
        ? revenue / state.bookings.length
        : 0;

    showSheet(`

        <div class="sheet-header">

            <div class="sheet-title">
                Statistics
            </div>

        </div>

        <div class="stat-grid">

            ${statCard(
                state.guests.length,
                "Customers"
            )}

            ${statCard(
                state.bookings.length,
                "Bookings"
            )}

            ${statCard(
                money(revenue),
                "Revenue"
            )}

            ${statCard(
                roomNights,
                "Room nights"
            )}

        </div>

        <div class="section-title">
            Current rooms
        </div>

        <div class="card card-pad">

            <div class="list-row">

                <span>
                    Available
                </span>

                <strong>
                    ${state.rooms.filter(r=>r.status==="available").length}
                </strong>

            </div>

            <div class="list-row"
                 style="margin-top:11px">

                <span>
                    Occupied
                </span>

                <strong>
                    ${occupied}
                </strong>

            </div>

            <div class="list-row"
                 style="margin-top:11px">

                <span>
                    Cleaning
                </span>

                <strong>
                    ${state.rooms.filter(r=>r.status==="cleaning").length}
                </strong>

            </div>

            <div class="list-row"
                 style="margin-top:11px">

                <span>
                    Maintenance
                </span>

                <strong>
                    ${state.rooms.filter(r=>r.status==="maintenance").length}
                </strong>

            </div>

        </div>

        <div class="section-title">
            Average booking value
        </div>

        <div class="card card-pad">

            <strong style="font-size:24px">
                ${money(average)}
            </strong>

        </div>

    `);
}

/* =========================================================
   ROOM SETTINGS
   ========================================================= */

function openRoomSettings() {

    if(!requireManager("edit rooms"))
        return;

    showSheet(`

        <div class="sheet-header">

            <div class="sheet-title">
                Room management
            </div>

            <button
                class="btn btn-secondary btn-small"
                onclick="addRoom()">

                + Add room

            </button>

        </div>

        ${
            state.rooms.map(room => `

                <div class="card card-pad"
                     style="margin-bottom:9px">

                    <div class="list-row">

                        <div>

                            <div class="list-title">
                                Room ${esc(room.room_number)}
                            </div>

                            <div class="list-subtitle">
                                ${esc(room.room_name || "")}
                            </div>

                        </div>

                        <button
                            class="btn btn-outline btn-small"
                            onclick="editRoom('${room.id}')">

                            Edit

                        </button>

                    </div>

                </div>

            `).join("")
        }

    `);
}


async function addRoom() {

    if(!requireManager("add rooms"))
        return;

    const number =
        prompt("Room number:");

    if(!number)
        return;

    const name =
        prompt("Room name:");

    const type =
        state.roomTypes[0];

    if(!type) {

        toast(
            "Create a room type first."
        );

        return;
    }

    const result =
        await insertRow(
            "rooms",
            {
                room_number:number,
                room_name:name || "",
                room_type_id:type.id,
                status:"available"
            }
        );

    if(result.error) {

        toast(
            databaseError(result.error)
        );

        return;
    }

    await loadDatabase();

    closeSheet();

    openRoomSettings();

    toast("Room added.");
}


async function editRoom(id) {

    if(!requireManager("edit rooms"))
        return;

    const room =
        state.rooms.find(
            r => r.id === id
        );

    if(!room)
        return;

    const name =
        prompt(
            "Room name:",
            room.room_name || ""
        );

    if(name === null)
        return;

    const result =
        await updateRow(
            "rooms",
            id,
            {
                room_name:name
            }
        );

    if(result.error) {

        toast(
            databaseError(result.error)
        );

        return;
    }

    await loadDatabase();

    closeSheet();

    openRoomSettings();

    toast("Room updated.");
}

/* =========================================================
   STAFF SETTINGS
   ========================================================= */

async function openStaffSettings() {

    if(!requireManager("manage staff"))
        return;

    const result =
        await selectTable(
            "staff",
            {
                order:"name",
                ascending:true
            }
        );

    const staff =
        result.data || [];

    showSheet(`

        <div class="sheet-header">

            <div class="sheet-title">
                Staff
            </div>

            <button
                class="btn btn-secondary btn-small"
                onclick="addStaff()">

                + Add

            </button>

        </div>

        ${
            staff.map(member => `

                <div class="card card-pad"
                     style="margin-bottom:9px">

                    <div class="list-row">

                        <div>

                            <div class="list-title">
                                ${esc(member.name)}
                            </div>

                            <div class="list-subtitle">
                                @${esc(member.username || "")}
                            </div>

                            <div class="list-subtitle">
                                ${
                                    Array.isArray(member.roles)
                                    ? esc(member.roles.join(" · "))
                                    : esc(member.role || "")
                                }
                            </div>

                        </div>

                    </div>

                </div>

            `).join("")
        }

    `);
}


async function addStaff() {

    if(!requireManager("add staff"))
        return;

    const name =
        prompt("Staff name:");

    if(!name)
        return;

    const username =
        prompt("Username:");

    const role =
        prompt(
            "Role:",
            "Receptionist"
        );

    const result =
        await insertRow(
            "staff",
            {
                name,
                username:username || null,
                roles:[role || "Staff"],
                active:true
            }
        );

    if(result.error) {

        toast(
            databaseError(result.error)
        );

        return;
    }

    closeSheet();

    toast("Staff profile created.");
}


/* =========================================================
   SHEET SYSTEM
   ========================================================= */

function showSheet(content) {

    closeSheet();

    const overlay =
        document.createElement("div");

    overlay.id =
        "activeSheet";

    overlay.className =
        "overlay";

    overlay.innerHTML = `

        <div class="sheet">

            <div class="sheet-handle"></div>

            ${content}

        </div>

    `;

    overlay.addEventListener(
        "click",
        event => {

            if(event.target === overlay)
                closeSheet();

        }
    );

    document.body.appendChild(overlay);
}


function closeSheet() {

    document
        .getElementById("activeSheet")
        ?.remove();
}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    state.staff = null;

    localStorage.removeItem(
        "fawnwood_staff_id"
    );

    closeSheet();

    restoreSession();
}


/* =========================================================
   INITIALISE
   ========================================================= */

restoreSession();
