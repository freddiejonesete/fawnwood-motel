<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fawnwood Hotel Management</title>

<style>
:root{
  --forest:#19352b;
  --forest-dark:#10271f;
  --forest-light:#2f5847;
  --sage:#718b78;
  --cream:#f5f1e8;
  --paper:#fbf9f3;
  --tan:#d7c7a7;
  --brown:#765d42;
  --gold:#b18b4a;
  --red:#9b4c43;
  --green:#3f7657;
  --text:#17211d;
  --muted:#718078;
  --line:#dedbd1;
  --shadow:0 8px 25px rgba(24,45,36,.08);
  --radius:20px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--cream);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
}

body{
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  min-height:100vh;
}

/* =========================
   ICONS
========================= */

.icon{
  width:22px;
  height:22px;
  display:block;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon.fill{
  fill:currentColor;
  stroke:none;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    max(28px,env(safe-area-inset-top))
    20px
    max(28px,env(safe-area-inset-bottom))
    20px;
  background:
    linear-gradient(rgba(17,39,31,.80),rgba(17,39,31,.92)),
    radial-gradient(circle at 20% 20%,#557463,transparent 40%),
    radial-gradient(circle at 80% 80%,#2e4d3d,transparent 40%);
  color:white;
}

.login-card{
  width:100%;
  max-width:460px;
  background:rgba(250,247,238,.98);
  color:var(--text);
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.brand{
  text-align:center;
  margin-bottom:26px;
}

.brand-mark{
  width:66px;
  height:66px;
  margin:auto;
  border-radius:20px;
  background:var(--forest);
  color:#e5dcc7;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 25px rgba(25,53,43,.25);
}

.brand-mark .icon{
  width:34px;
  height:34px;
}

.brand h1{
  margin:15px 0 3px;
  font-size:25px;
  letter-spacing:-.7px;
}

.brand p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.login-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--brown);
}

.profile-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.profile-card{
  border:1px solid var(--line);
  background:white;
  border-radius:17px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  width:100%;
  transition:.15s;
}

.profile-card:active{
  transform:scale(.98);
}

.profile-avatar{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#e6ece5;
  color:var(--forest);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.profile-info{
  flex:1;
  min-width:0;
}

.profile-name{
  font-weight:750;
}

.profile-role{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.profile-arrow{
  color:#9aa39e;
}

.empty-profiles{
  border:1px dashed #c8c4b9;
  border-radius:17px;
  padding:25px 18px;
  text-align:center;
  color:var(--muted);
  margin-bottom:10px;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.ghost-btn{
  border:0;
  border-radius:14px;
  padding:14px 17px;
  font-weight:750;
  min-height:48px;
  transition:.15s;
}

.primary-btn{
  background:var(--forest);
  color:white;
}

.secondary-btn{
  background:#e8e4d9;
  color:var(--forest);
}

.ghost-btn{
  background:transparent;
  color:var(--forest);
  border:1px solid var(--line);
}

.danger-btn{
  background:#f2dfdc;
  color:#843d36;
}

.primary-btn:active,
.secondary-btn:active,
.danger-btn:active,
.ghost-btn:active{
  transform:scale(.98);
}

/* =========================
   MAIN APP
========================= */

#mainApp{
  display:none;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(245,241,232,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(160,153,138,.25);
  padding:
    max(13px,env(safe-area-inset-top))
    16px
    12px;
}

.topbar-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  max-width:760px;
  margin:auto;
}

.top-brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.mini-mark{
  width:39px;
  height:39px;
  flex:none;
  border-radius:12px;
  background:var(--forest);
  color:#eee6d4;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mini-mark .icon{
  width:22px;
  height:22px;
}

.top-title{
  min-width:0;
}

.top-title strong{
  display:block;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-title span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
}

.top-actions{
  display:flex;
  gap:7px;
  flex:none;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.75);
  color:var(--forest);
  display:flex;
  align-items:center;
  justify-content:center;
}

.page{
  max-width:760px;
  margin:auto;
  padding:22px 16px 35px;
}

.page-header{
  margin-bottom:20px;
}

.eyebrow{
  color:var(--brown);
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.12em;
  font-size:11px;
  margin-bottom:5px;
}

.page-header h1{
  font-size:31px;
  line-height:1.05;
  letter-spacing:-1px;
  margin:0;
}

.page-header p{
  color:var(--muted);
  margin:8px 0 0;
  line-height:1.45;
}

/* =========================
   DASHBOARD
========================= */

.welcome-card{
  background:
    linear-gradient(135deg,rgba(25,53,43,.98),rgba(48,83,68,.96));
  color:white;
  border-radius:25px;
  padding:23px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.welcome-card:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  right:-70px;
  top:-70px;
}

.welcome-card h2{
  font-size:28px;
  letter-spacing:-.8px;
  margin:0 0 5px;
}

.welcome-card p{
  margin:0;
  color:#d4dfd8;
  font-size:14px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.feature-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  min-height:128px;
  text-align:left;
  box-shadow:0 3px 12px rgba(30,50,40,.035);
}

.feature-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e5ebe5;
  color:var(--forest);
  margin-bottom:17px;
}

.feature-card strong{
  display:block;
  font-size:14px;
}

.feature-card span{
  display:block;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
  margin-top:3px;
}

/* =========================
   STATS CARDS
========================= */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}

.stat-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
}

.stat-card .stat-icon{
  color:var(--sage);
  margin-bottom:11px;
}

.stat-number{
  font-size:24px;
  font-weight:850;
  letter-spacing:-.7px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

/* =========================
   SECTIONS / CARDS
========================= */

.section{
  margin-top:22px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.section-title h2{
  font-size:17px;
  margin:0;
  letter-spacing:-.3px;
}

.section-title button{
  background:none;
  border:0;
  color:var(--forest);
  font-size:12px;
  font-weight:750;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:19px;
  padding:17px;
  box-shadow:0 3px 12px rgba(30,50,40,.03);
}

.stack{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:14px 0;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

/* =========================
   FORMS
========================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group label{
  font-size:12px;
  font-weight:750;
  color:#45534c;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d7d4ca;
  background:white;
  border-radius:13px;
  padding:13px 14px;
  color:var(--text);
  outline:none;
  min-height:47px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--forest-light);
  box-shadow:0 0 0 3px rgba(47,88,71,.09);
}

.form-actions{
  display:flex;
  gap:9px;
  margin-top:17px;
}

.form-actions>*{
  flex:1;
}

/* =========================
   CHECK IN
========================= */

.step-bar{
  display:flex;
  gap:5px;
  margin-bottom:18px;
}

.step{
  height:4px;
  flex:1;
  background:#d8d5cc;
  border-radius:4px;
}

.step.active{
  background:var(--forest);
}

.booking-summary{
  background:#e9eee8;
  border-radius:15px;
  padding:14px;
  margin-top:13px;
}

.price-large{
  font-size:29px;
  font-weight:850;
  letter-spacing:-1px;
}

.room-found{
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px;
  background:#edf2ec;
  border-radius:16px;
  margin-top:12px;
}

.room-number{
  width:54px;
  height:54px;
  border-radius:15px;
  background:var(--forest);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:850;
  font-size:16px;
}

.room-found-info{
  flex:1;
}

.room-found-info strong{
  display:block;
}

.room-found-info span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* =========================
   ROOMS MAP
========================= */

.room-map{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.room-tile{
  min-height:125px;
  border-radius:18px;
  border:1px solid var(--line);
  background:var(--paper);
  padding:14px;
  text-align:left;
  position:relative;
}

.room-tile.available{
  border-color:#b9cfbc;
}

.room-tile.occupied{
  background:#eef0eb;
  border-color:#c4ccc4;
}

.room-tile.cleaning{
  background:#f3ead8;
  border-color:#dccba9;
}

.room-tile.maintenance{
  background:#f2dddd;
  border-color:#ddbbb7;
}

.room-tile-number{
  font-size:19px;
  font-weight:850;
}

.room-tile-name{
  font-size:12px;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-type{
  font-size:10px;
  color:var(--muted);
  margin-top:8px;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:10px;
  font-weight:750;
  margin-top:10px;
  padding:5px 8px;
  border-radius:20px;
  background:white;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#71977b;
}

.occupied .status-dot{
  background:#8b8b7b;
}

.cleaning .status-dot{
  background:#ad8b4f;
}

.maintenance .status-dot{
  background:#9b4c43;
}

/* =========================
   AMENITIES
========================= */

.amenity-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.amenity-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  width:100%;
}

.amenity-card .feature-icon{
  margin:0;
  flex:none;
}

.amenity-info{
  flex:1;
}

.amenity-info strong{
  display:block;
}

.amenity-info span{
  color:var(--muted);
  font-size:11px;
}

/* =========================
   ROOM SERVICE
========================= */

.credit-box{
  background:#e8eee8;
  border-radius:18px;
  padding:18px;
  margin-top:13px;
}

.credit-amount{
  font-size:32px;
  font-weight:850;
  letter-spacing:-1px;
}

.credit-sub{
  color:var(--muted);
  font-size:12px;
}

.charge-result{
  margin-top:14px;
  background:#f0e9d9;
  border-radius:17px;
  padding:16px;
}

.charge-result strong{
  font-size:21px;
}

/* =========================
   HOUSEKEEPING
========================= */

.task{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.task:last-child{
  border-bottom:0;
}

.check{
  width:25px;
  height:25px;
  border-radius:8px;
  border:1.5px solid #aab2ab;
  background:white;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.check.done{
  background:var(--forest);
  color:white;
  border-color:var(--forest);
}

.task-info{
  flex:1;
}

.task-info strong{
  font-size:14px;
}

.task-info span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

/* =========================
   ISSUES
========================= */

.issue{
  padding:15px;
  border-radius:16px;
  background:white;
  border:1px solid var(--line);
}

.issue-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.issue-status{
  font-size:10px;
  font-weight:800;
  padding:5px 8px;
  border-radius:20px;
  background:#eee9dd;
}

.issue-status.open{
  color:#885b29;
}

.issue-status.resolved{
  color:#3d7150;
  background:#e3eee5;
}

/* =========================
   CUSTOMERS
========================= */

.customer{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.customer:last-child{
  border-bottom:0;
}

.customer-avatar{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#e2e8e1;
  color:var(--forest);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.customer-info{
  flex:1;
}

.customer-info strong{
  display:block;
}

.customer-info span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

/* =========================
   SETTINGS
========================= */

.settings-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.settings-item{
  width:100%;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:17px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
}

.settings-item .feature-icon{
  margin:0;
  flex:none;
}

.settings-item div:nth-child(2){
  flex:1;
}

.settings-item strong{
  display:block;
  font-size:14px;
}

.settings-item span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  padding:
    7px
    10px
    max(8px,env(safe-area-inset-bottom));
  background:rgba(250,248,242,.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(140,140,130,.22);
}

.nav-inner{
  max-width:600px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#78817c;
  min-height:57px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:5px 2px;
}

.nav-btn .icon{
  width:20px;
  height:20px;
}

.nav-btn span{
  font-size:9px;
  font-weight:700;
}

.nav-btn.active{
  color:var(--forest);
  background:#e6ece5;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  background:rgba(12,23,18,.45);
  backdrop-filter:blur(4px);
}

.modal.show{
  display:flex;
}

.modal-sheet{
  width:100%;
  max-height:90vh;
  overflow:auto;
  background:var(--paper);
  border-radius:25px 25px 0 0;
  padding:
    9px
    18px
    max(25px,env(safe-area-inset-bottom));
  animation:slideUp .2s ease;
}

@keyframes slideUp{
  from{transform:translateY(30px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.modal-handle{
  width:40px;
  height:4px;
  background:#c9c6bd;
  border-radius:5px;
  margin:4px auto 17px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.modal-header h2{
  margin:0;
  font-size:20px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:200;
  left:16px;
  right:16px;
  bottom:calc(92px + env(safe-area-inset-bottom));
  max-width:500px;
  margin:auto;
  background:var(--forest-dark);
  color:white;
  border-radius:15px;
  padding:14px 16px;
  text-align:center;
  font-size:13px;
  box-shadow:0 12px 35px rgba(0,0,0,.2);
  display:none;
}

.toast.show{
  display:block;
  animation:toast .2s ease;
}

@keyframes toast{
  from{transform:translateY(8px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* =========================
   DESKTOP SUPPORT
========================= */

@media(min-width:700px){
  .quick-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .room-map{
    grid-template-columns:repeat(4,1fr);
  }

  .form-grid.two{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="login-card">

    <div class="brand">

      <div class="brand-mark">
        <svg class="icon fill" viewBox="0 0 24 24">
          <path d="M12 2C8.5 7 5 10.3 5 15a7 7 0 0 0 14 0c0-4.7-3.5-8-7-13Z"/>
          <path d="M12 7v11" stroke="#f5f1e8" fill="none" stroke-width="1.5"/>
        </svg>
      </div>

      <h1>fawnwood</h1>
      <p>hotel management system</p>

    </div>

    <div class="login-title">Who are you?</div>

    <div id="profileList" class="profile-list"></div>

    <button class="primary-btn" style="width:100%;margin-top:10px"
      onclick="openAddProfile()">
      + Add staff profile
    </button>

  </div>

</section>


<!-- =====================================================
     MAIN APPLICATION
===================================================== -->

<section id="mainApp">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="top-brand">

        <div class="mini-mark">
          <svg class="icon fill" viewBox="0 0 24 24">
            <path d="M12 2C8.5 7 5 10.3 5 15a7 7 0 0 0 14 0c0-4.7-3.5-8-7-13Z"/>
          </svg>
        </div>

        <div class="top-title">
          <strong>fawnwood hotel</strong>
          <span id="staffDisplay">Staff</span>
        </div>

      </div>

      <div class="top-actions">

        <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.5V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6v-2.5h.5a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5h2.5v.5a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.5V14h-.5a1.7 1.7 0 0 0-1.6 1Z"/>
          </svg>
        </button>

        <button class="icon-btn" onclick="logout()" aria-label="Exit">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M10 17l5-5-5-5"/>
            <path d="M15 12H3"/>
            <path d="M13 4h6v16h-6"/>
          </svg>
        </button>

      </div>

    </div>

  </header>


  <main id="content"></main>


  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <div class="nav-inner">

      <button class="nav-btn active" data-page="home" onclick="navigate('home')">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="m3 11 9-8 9 8"/>
          <path d="M5 10v10h14V10"/>
          <path d="M9 20v-6h6v6"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-btn" data-page="checkin" onclick="navigate('checkin')">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M4 5h16v14H4z"/>
          <path d="M8 9h8M8 13h5"/>
          <path d="M15 16h3"/>
        </svg>
        <span>Check-in</span>
      </button>

      <button class="nav-btn" data-page="rooms" onclick="navigate('rooms')">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M4 20V7l8-4 8 4v13"/>
          <path d="M8 20v-6h8v6"/>
          <path d="M8 9h2M14 9h2"/>
        </svg>
        <span>Rooms</span>
      </button>

      <button class="nav-btn" data-page="amenities" onclick="navigate('amenities')">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M12 3v18M3 12h18"/>
          <circle cx="12" cy="12" r="8"/>
        </svg>
        <span>Amenities</span>
      </button>

    </div>

  </nav>

</section>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal" class="modal" onclick="modalBackground(event)">

  <div class="modal-sheet">

    <div class="modal-handle"></div>

    <div id="modalContent"></div>

  </div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =====================================================
   DATA
===================================================== */

const defaultRooms = [
  {number:"101",name:"Oak",type:"Standard",status:"available",guest:null},
  {number:"102",name:"Pine",type:"Standard",status:"available",guest:null},
  {number:"103",name:"Fern",type:"Standard",status:"available",guest:null},
  {number:"104",name:"Moss",type:"Standard",status:"available",guest:null},

  {number:"201",name:"Cedar",type:"Deluxe",status:"available",guest:null},
  {number:"202",name:"Birch",type:"Deluxe",status:"available",guest:null},
  {number:"203",name:"Willow",type:"Deluxe",status:"available",guest:null},
  {number:"204",name:"Aspen",type:"Deluxe",status:"available",guest:null},

  {number:"301",name:"Forest",type:"Suite",status:"available",guest:null},
  {number:"302",name:"Woodland",type:"Suite",status:"available",guest:null},
  {number:"303",name:"Canopy",type:"Suite",status:"available",guest:null},
  {number:"304",name:"Hollow",type:"Suite",status:"available",guest:null}
];

const defaultSettings = {
  roomTypes:{
    Standard:120,
    Deluxe:180,
    Suite:275
  },
  boardRates:{
    "Room Only":0,
    "B&B":35,
    "B&B + Evening Meal":65
  },
  cleaningGuide:[
    "Strip and replace all bed linen",
    "Clean and sanitise bathroom",
    "Restock towels and toiletries",
    "Vacuum and clean all flooring",
    "Dust surfaces and furniture",
    "Check lights, appliances and fixtures",
    "Empty bins",
    "Final presentation check"
  ],
  checkinQuestions:[
    "Is there anything we should know about your stay?",
    "Do you have any special requests?",
    "Would you like us to note any accessibility requirements?"
  ]
};

let rooms = JSON.parse(localStorage.getItem("fawnwood_rooms")) || defaultRooms;
let profiles = JSON.parse(localStorage.getItem("fawnwood_profiles")) || [];
let customers = JSON.parse(localStorage.getItem("fawnwood_customers")) || [];
let issues = JSON.parse(localStorage.getItem("fawnwood_issues")) || [];
let bookings = JSON.parse(localStorage.getItem("fawnwood_bookings")) || [];
let hotelSettings = JSON.parse(localStorage.getItem("fawnwood_settings")) || defaultSettings;

let currentStaff = JSON.parse(localStorage.getItem("fawnwood_current_staff")) || null;
let currentPage = "home";
let checkinData = {};


/* =====================================================
   STORAGE
===================================================== */

function save(){
  localStorage.setItem("fawnwood_rooms",JSON.stringify(rooms));
  localStorage.setItem("fawnwood_profiles",JSON.stringify(profiles));
  localStorage.setItem("fawnwood_customers",JSON.stringify(customers));
  localStorage.setItem("fawnwood_issues",JSON.stringify(issues));
  localStorage.setItem("fawnwood_bookings",JSON.stringify(bookings));
  localStorage.setItem("fawnwood_settings",JSON.stringify(hotelSettings));
}


/* =====================================================
   INIT
===================================================== */

function init(){

  if(currentStaff){
    showApp();
  }else{
    renderProfiles();
  }

}

init();


/* =====================================================
   LOGIN / PROFILES
===================================================== */

function renderProfiles(){

  const list = document.getElementById("profileList");

  if(!profiles.length){

    list.innerHTML = `
      <div class="empty-profiles">
        <strong>No staff profiles yet</strong>
        <div style="margin-top:5px;font-size:12px">
          Add a profile to enter the hotel system.
        </div>
      </div>
    `;

    return;
  }

  list.innerHTML = profiles.map((p,i)=>`

    <button class="profile-card" onclick="loginProfile(${i})">

      <div class="profile-avatar">
        ${initials(p.name)}
      </div>

      <div class="profile-info">
        <div class="profile-name">${escapeHTML(p.name)}</div>
        <div class="profile-role">${escapeHTML(p.roles.join(" • "))}</div>
      </div>

      <div class="profile-arrow">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </div>

    </button>

  `).join("");

}


function openAddProfile(){

  showModal(`
    <div class="modal-header">
      <h2>Add staff profile</h2>
      <button class="icon-btn" onclick="closeModal()">×</button>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Name</label>
        <input id="newProfileName" placeholder="e.g. Alex">
      </div>

      <div class="form-group">
        <label>Username</label>
        <input id="newProfileUsername" placeholder="@username">
      </div>

      <div class="form-group">
        <label>Role</label>
        <select id="newProfileRole">
          <option>Front Desk</option>
          <option>Housekeeping</option>
          <option>Maintenance</option>
          <option>Manager</option>
          <option>General Staff</option>
        </select>
      </div>

      <button class="primary-btn" onclick="createProfile()">
        Create profile
      </button>

    </div>
  `);

}


function createProfile(){

  const name=document.getElementById("newProfileName").value.trim();
  const username=document.getElementById("newProfileUsername").value.trim();
  const role=document.getElementById("newProfileRole").value;

  if(!name){
    toast("Please enter a name.");
    return;
  }

  profiles.push({
    id:Date.now(),
    name,
    username,
    roles:[role]
  });

  save();
  closeModal();
  renderProfiles();
  toast("Staff profile created.");

}


function loginProfile(index){

  currentStaff=profiles[index];

  localStorage.setItem(
    "fawnwood_current_staff",
    JSON.stringify(currentStaff)
  );

  showApp();

}


function logout(){

  currentStaff=null;
  localStorage.removeItem("fawnwood_current_staff");

  document.getElementById("mainApp").style.display="none";
  document.getElementById("loginScreen").style.display="flex";

  renderProfiles();

}


/* =====================================================
   APP
===================================================== */

function showApp(){

  document.getElementById("loginScreen").style.display="none";
  document.getElementById("mainApp").style.display="block";

  document.getElementById("staffDisplay").textContent =
    `${currentStaff.name} • ${currentStaff.roles.join(" • ")}`;

  navigate("home");

}


function navigate(page){

  currentPage=page;

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page===page
    );
  });

  if(page==="home") renderHome();
  if(page==="checkin") renderCheckin();
  if(page==="rooms") renderRooms();
  if(page==="amenities") renderAmenities();

  window.scrollTo({top:0,behavior:"smooth"});

}


/* =====================================================
   HOME
===================================================== */

function renderHome(){

  const occupied=rooms.filter(r=>r.status==="occupied").length;
  const available=rooms.filter(r=>r.status==="available").length;
  const cleaning=rooms.filter(r=>r.status==="cleaning").length;
  const openIssues=issues.filter(i=>i.status==="open").length;

  document.getElementById("content").innerHTML=`

    <div class="page">

      <div class="welcome-card">

        <div class="eyebrow" style="color:#b9cdbf">
          Fawnwood Hotel
        </div>

        <h2>Good ${timeGreeting()}, ${escapeHTML(currentStaff.name)}.</h2>

        <p>
          What would you like to take care of?
        </p>

      </div>


      <div class="quick-grid">

        ${featureCard(
          "checkin",
          "Check-in",
          "Create a new guest booking",
          `<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/>`
        )}

        ${featureCard(
          "rooms",
          "Rooms",
          "View occupancy and room information",
          `<path d="M4 20V7l8-4 8 4v13"/><path d="M8 20v-6h8v6"/>`
        )}

        ${featureCard(
          "amenities",
          "Amenities",
          "Cleaning, maintenance and room service",
          `<path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/>`
        )}

        ${featureCard(
          "customers",
          "Customers",
          "View previous guests",
          `<circle cx="12" cy="8" r="3"/><path d="M5 21a7 7 0 0 1 14 0"/>`
        )}

        ${featureCard(
          "statistics",
          "Statistics",
          "Hotel performance",
          `<path d="M4 19V5M4 19h16"/><path d="m7 15 4-5 3 2 5-7"/>`
        )}

        ${isManager() ? featureCard(
          "settings",
          "Settings",
          "Manage the hotel system",
          `<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19 14h2M3 14h2M12 3v2M12 19v2"/>`
        ) : ""}

      </div>


      <div class="section">

        <div class="section-title">
          <h2>Hotel overview</h2>
        </div>

        <div class="stat-grid">

          <div class="stat-card">
            <div class="stat-icon">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M4 20V7l8-4 8 4v13"/>
              </svg>
            </div>
            <div class="stat-number">${occupied}</div>
            <div class="stat-label">Occupied rooms</div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M4 20V7l8-4 8 4v13"/>
              </svg>
            </div>
            <div class="stat-number">${available}</div>
            <div class="stat-label">Available rooms</div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M5 4h14v16H5z"/>
                <path d="M8 8h8M8 12h8M8 16h5"/>
              </svg>
            </div>
            <div class="stat-number">${cleaning}</div>
            <div class="stat-label">Being cleaned</div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 3 3 7l9 4 9-4-9-4Z"/>
                <path d="m6 10v6c2 2 10 2 12 0v-6"/>
              </svg>
            </div>
            <div class="stat-number">${openIssues}</div>
            <div class="stat-label">Open issues</div>
          </div>

        </div>

      </div>

    </div>
  `;

}


function featureCard(page,title,description,path){

  return `
    <button class="feature-card" onclick="openFeature('${page}')">

      <div class="feature-icon">

        <svg class="icon" viewBox="0 0 24 24">
          ${path}
        </svg>

      </div>

      <strong>${title}</strong>
      <span>${description}</span>

    </button>
  `;

}


function openFeature(page){

  if(page==="customers"){
    renderCustomers();
    return;
  }

  if(page==="statistics"){
    renderStatistics();
    return;
  }

  if(page==="settings"){
    openSettings();
    return;
  }

  navigate(page);

}


/* =====================================================
   CHECK-IN
===================================================== */

function renderCheckin(){

  checkinData={};

  document.getElementById("content").innerHTML=`

    <div class="page">

      <div class="page-header">

        <div class="eyebrow">Front desk</div>

        <h1>New check-in</h1>

        <p>
          Create a booking and assign the most appropriate available room.
        </p>

      </div>

      <div id="checkinArea"></div>

    </div>
  `;

  checkinStep1();

}


function checkinStep1(){

  document.getElementById("checkinArea").innerHTML=`

    ${steps(1)}

    <div class="card">

      <div class="form-grid">

        <div class="form-group">
          <label>Number of nights</label>
          <input id="nights" type="number" min="1" value="1">
        </div>

        <div class="form-group">
          <label>Room type</label>
          <select id="roomType">
            ${Object.keys(hotelSettings.roomTypes)
              .map(t=>`<option>${t}</option>`).join("")}
          </select>
        </div>

        <div class="form-group">
          <label>Board basis</label>
          <select id="boardBasis">
            ${Object.keys(hotelSettings.boardRates)
              .map(t=>`<option>${t}</option>`).join("")}
          </select>
        </div>

      </div>

      <div id="roomPreview"></div>

      <div class="form-actions">

        <button class="primary-btn" onclick="findRoom()">
          Find room
        </button>

      </div>

    </div>
  `;

}


function findRoom(){

  const nights=Math.max(
    1,
    parseInt(document.getElementById("nights").value)||1
  );

  const type=document.getElementById("roomType").value;
  const board=document.getElementById("boardBasis").value;

  const room=rooms.find(
    r=>r.type===type && r.status==="available"
  );

  if(!room){

    document.getElementById("roomPreview").innerHTML=`

      <div class="booking-summary">
        <strong>No ${type} rooms are currently available.</strong>
        <div class="small muted" style="margin-top:4px">
          Try another room type.
        </div>
      </div>

    `;

    return;
  }

  const roomRate=hotelSettings.roomTypes[type];
  const boardRate=hotelSettings.boardRates[board];

  const nightly=roomRate+boardRate;
  const total=nightly*nights;

  checkinData={
    nights,
    type,
    board,
    room,
    roomRate,
    boardRate,
    total
  };

  document.getElementById("roomPreview").innerHTML=`

    <div class="room-found">

      <div class="room-number">
        ${room.number}
      </div>

      <div class="room-found-info">
        <strong>${room.name}</strong>
        <span>${room.type} • ${board}</span>
      </div>

    </div>

    <div class="booking-summary">

      <div class="row">
        <span>Room</span>
        <strong>${roomRate} B$/night</strong>
      </div>

      <div class="row" style="margin-top:7px">
        <span>Board</span>
        <strong>${boardRate} B$/night</strong>
      </div>

      <div class="divider"></div>

      <div class="row">
        <span>${nights} night${nights===1?"":"s"}</span>
        <strong class="price-large">${total} B$</strong>
      </div>

    </div>

    <div class="form-actions">

      <button class="primary-btn" onclick="checkinStep2()">
        Continue
      </button>

    </div>

  `;

}


function checkinStep2(){

  if(!checkinData.room){
    toast("Find a room first.");
    return;
  }

  document.getElementById("checkinArea").innerHTML=`

    ${steps(2)}

    <div class="card">

      <div class="form-grid">

        <div class="form-group">
          <label>Title</label>
          <select id="guestTitle">
            <option>Mr</option>
            <option>Mrs</option>
            <option>Ms</option>
            <option>Miss</option>
            <option>Dr</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full name</label>
          <input id="guestName" placeholder="Guest name">
        </div>

        <div class="form-group">
          <label>Username</label>
          <input id="guestUsername" placeholder="@username">
        </div>

        ${hotelSettings.checkinQuestions.map((q,i)=>`

          <div class="form-group">
            <label>${escapeHTML(q)}</label>
            <textarea id="question${i}" placeholder="Optional"></textarea>
          </div>

        `).join("")}

      </div>

      <div class="form-actions">

        <button class="secondary-btn" onclick="checkinStep1()">
          Back
        </button>

        <button class="primary-btn" onclick="checkinStep3()">
          Continue
        </button>

      </div>

    </div>
  `;

}


function checkinStep3(){

  const title=document.getElementById("guestTitle").value;
  const name=document.getElementById("guestName").value.trim();
  const username=document.getElementById("guestUsername").value.trim();

  if(!name){
    toast("Please enter the guest's name.");
    return;
  }

  const previous=customers.find(
    c=>(
      c.name.toLowerCase()===name.toLowerCase()
      ||
      (username && c.username.toLowerCase()===username.toLowerCase())
    )
  );

  checkinData.title=title;
  checkinData.name=name;
  checkinData.username=username;
  checkinData.previous=previous;

  document.getElementById("checkinArea").innerHTML=`

    ${steps(3)}

    <div class="card">

      ${
        previous
        ?
        `
        <div class="booking-summary"
          style="background:#e3eee5">

          <strong>Previous customer</strong>

          <div class="small" style="margin-top:5px">
            Welcome back, ${escapeHTML(name)}.
            We found a previous stay in the hotel records.
          </div>

        </div>
        `
        :
        ""
      }

      <div class="section" style="margin-top:0">

        <div class="section-title">
          <h2>Booking summary</h2>
        </div>

        <div class="stack">

          <div class="row">
            <span>Guest</span>
            <strong>${escapeHTML(title)} ${escapeHTML(name)}</strong>
          </div>

          <div class="row">
            <span>Room</span>
            <strong>${checkinData.room.number}</strong>
          </div>

          <div class="row">
            <span>Room type</span>
            <strong>${checkinData.type}</strong>
          </div>

          <div class="row">
            <span>Board</span>
            <strong>${checkinData.board}</strong>
          </div>

          <div class="row">
            <span>Nights</span>
            <strong>${checkinData.nights}</strong>
          </div>

          <div class="divider"></div>

          <div class="row">
            <span>Total</span>
            <strong class="price-large">
              ${checkinData.total} B$
            </strong>
          </div>

        </div>

      </div>

      <div class="form-actions">

        <button class="secondary-btn" onclick="checkinStep2()">
          Back
        </button>

        <button class="primary-btn" onclick="checkinPayment()">
          Continue to payment
        </button>

      </div>

    </div>
  `;

}


function checkinPayment(){

  document.getElementById("checkinArea").innerHTML=`

    ${steps(4)}

    <div class="card">

      <div style="text-align:center;padding:10px 0 20px">

        <div class="eyebrow">Amount due</div>

        <div class="price-large" style="font-size:42px">
          ${checkinData.total} B$
        </div>

      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>Payment method</label>
          <select id="paymentMethod">
            <option>Cash</option>
            <option>Card</option>
            <option>Other</option>
          </select>
        </div>

      </div>

      <div class="form-actions">

        <button class="secondary-btn" onclick="checkinStep3()">
          Back
        </button>

        <button class="primary-btn" onclick="completeCheckin()">
          Take payment & check in
        </button>

      </div>

    </div>

  `;

}


function completeCheckin(){

  const room=rooms.find(
    r=>r.number===checkinData.room.number
  );

  if(!room){
    toast("Room could not be found.");
    return;
  }

  room.status="occupied";

  room.guest={
    title:checkinData.title,
    name:checkinData.name,
    username:checkinData.username,
    board:checkinData.board,
    nights:checkinData.nights,
    roomServiceAllowance:100,

    guest:checkinData.name,

          </div>

      ?
      `
      <button class="secondary-btn"
        style="width:100%;margin-top:12px"
        onclick="startCheckout(${index})">
        Check guest out
      </button>
      `
      :
      ""
    }

    ${
      room.status==="maintenance"
      ?
      `
      <button class="secondary-btn"
        style="width:100%;margin-top:12px"
        onclick="setRoomStatus(${index},'available')">
        Mark available
      </button>
      `
      :

  `);

}


function startCheckout(index){

  const room=rooms[index];

  if(!room.guest){
    toast("There is no guest in this room.");
    return;
  }

  room.status="cleaning";

  const customer=customers.find(
    c=>c.name.toLowerCase()===room.guest.name.toLowerCase()
  );

  if(customer){
    customer.lastStay=new Date().toISOString();
  }

  room.guest=null;

  save();
  closeModal();

  toast(`Room ${room.number} added to housekeeping.`);

  renderRooms();

}


function setRoomStatus(index,status){

  rooms[index].status=status;

  save();
  closeModal();
  renderRooms();

}

function renderRoomService(){

  document.getElementById("content").innerHTML=`

                ${escapeHTML(room.guest.name)} — Room ${room.number}
              </option>

            `).join("")}

        </div>

        <div id="serviceInfo"></div>

  `;

}


function updateServiceInfo(){

  const number=document.getElementById("serviceGuest").value;

  if(!number){
    document.getElementById("serviceInfo").innerHTML="";
    return;
  }

  const room=rooms.find(r=>r.number===number);

  if(!room || !room.guest) return;

  const used=room.guest.roomServiceUsed||0;
  const freeRemaining=Math.max(0,100-used);

  document.getElementById("serviceInfo").innerHTML=`

    <div class="credit-box">

      <div class="credit-sub">
        ${escapeHTML(room.guest.name)} • Room ${room.number}
      </div>

      <div class="credit-amount">
        ${freeRemaining} B$
      </div>

      <div class="credit-sub">
        free room service remaining
      </div>

      <div style="margin-top:14px">

        <div class="form-group">

          <label>
            Room service amount
          </label>

          <input
            id="serviceAmount"
            type="number"
            min="0"
            value="0"
            oninput="calculateServiceCharge()"
          >

        </div>

      </div>

    </div>

    <div id="serviceCharge" class="charge-result">

      <div class="row">
        <span>Guest pays</span>
        <strong>0 B$</strong>
      </div>

    </div>

    <button class="primary-btn"
      style="width:100%;margin-top:12px"
      onclick="chargeRoomService()">
      Add room service
    </button>

  `;

}


function calculateServiceCharge(){

  const number=document.getElementById("serviceGuest").value;
  const amount=Math.max(
    0,
    Number(document.getElementById("serviceAmount").value)||0
  );

  const room=rooms.find(r=>r.number===number);

  if(!room || !room.guest) return;

  const used=room.guest.roomServiceUsed||0;

  /*
    First 100 B$ total room service is free.
    Anything beyond that is charged.
  */

  const freeRemaining=Math.max(0,100-used);
  const charge=Math.max(0,amount-freeRemaining);

  document.getElementById("serviceCharge").innerHTML=`

    <div class="row">
      <span>Service requested</span>
      <strong>${amount} B$</strong>
    </div>

    <div class="row" style="margin-top:8px">
      <span>Free allowance used</span>
      <strong>${Math.min(amount,freeRemaining)} B$</strong>
    </div>

    <div class="divider"></div>

    <div class="row">
      <span>Added to bill</span>
      <strong>${charge} B$</strong>
    </div>

  `;

}


function chargeRoomService(){

  const number=document.getElementById("serviceGuest").value;
  const amount=Math.max(
    0,
    Number(document.getElementById("serviceAmount").value)||0
  );

  if(!number){
    toast("Select a customer first.");
    return;
  }

  const room=rooms.find(r=>r.number===number);

  if(!room || !room.guest){
    toast("Guest could not be found.");
    return;
  }

  const used=room.guest.roomServiceUsed||0;
  const freeRemaining=Math.max(0,100-used);

  const charge=Math.max(
    0,
    amount-freeRemaining
  );

  room.guest.roomServiceUsed=used+amount;

  room.guest.additionalCharges=
    (room.guest.additionalCharges||0)+charge;

  save();

  toast(
    charge>0
    ? `${charge} B$ added to the guest bill.`
    : "Room service covered by allowance."
  );

  renderRoomService();

}

/* =====================================================
   MANAGER ROOM EDITOR
===================================================== */

function editRooms(){

  if(!isManager()){
    toast("Manager access required.");
    return;
  }

  showModal(`

    <div class="modal-header">
      <h2>Manage rooms</h2>
      <button class="icon-btn" onclick="openSettings()">×</button>
    </div>

    <div class="stack">

      ${rooms.map((room,i)=>`

        <div class="card">

          <div class="row">

            <strong>
              Room ${escapeHTML(room.number)}
            </strong>

            <span class="small muted">
              ${escapeHTML(room.type)}
            </span>

          </div>

          <div style="margin-top:10px">

            <input
              id="roomName${i}"
              value="${escapeAttr(room.name)}"
              placeholder="Room name"
            >

          </div>

          <button class="secondary-btn"
            style="width:100%;margin-top:9px"
            onclick="saveRoomName(${i})">
            Save room name
          </button>

        </div>

      `).join("")}


      <button class="primary-btn"
        onclick="addRoom()">
        + Add room
      </button>

    </div>

  `);

}


function saveRoomName(index){

  const input=document.getElementById(`roomName${index}`);

  rooms[index].name=input.value.trim()||rooms[index].name;

  save();

  toast("Room name updated.");

}


function addRoom(){

  showModal(`

    <div class="modal-header">
      <h2>Add room</h2>
      <button class="icon-btn" onclick="editRooms()">×</button>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Room number</label>
        <input id="addRoomNumber">
      </div>

      <div class="form-group">
        <label>Room name</label>
        <input id="addRoomName">
      </div>

      <div class="form-group">

        <label>Room type</label>

        <select id="addRoomType">
          ${Object.keys(hotelSettings.roomTypes)
            .map(t=>`<option>${t}</option>`).join("")}
        </select>

      </div>

      <button class="primary-btn"
        onclick="createRoom()">
        Add room
      </button>

    </div>

  `);

}


function createRoom(){

  const number=document.getElementById("addRoomNumber").value.trim();
  const name=document.getElementById("addRoomName").value.trim();
  const type=document.getElementById("addRoomType").value;

  if(!number || !name){
    toast("Enter a room number and name.");
    return;
  }

  if(rooms.some(r=>r.number===number)){
    toast("That room number already exists.");
    return;
  }

  rooms.push({
    number,
    name,
    type,
    status:"available",
    guest:null
  });

  save();

  toast(`Room ${number} added.`);

  editRooms();

}

/* =====================================================
   HELPERS
===================================================== */

function isManager(){

  if(!currentStaff) return false;

  return currentStaff.roles.some(
    r=>r.toLowerCase()==="manager"
  );

}


function initials(name){

  return name
    .split(" ")
    .map(x=>x[0])
    .join("")
    .slice(0,2)
    .toUpperCase();

}


function timeGreeting(){

  const h=new Date().getHours();

  if(h<12) return "morning";
  if(h<18) return "afternoon";

  return "evening";

}


function steps(active){

  return `

    <div class="step-bar">

      ${[1,2,3,4].map(
        n=>`<div class="step ${n<=active?"active":""}"></div>`
      ).join("")}

    </div>

  `;

}


function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){
  return escapeHTML(value);
}


/* =====================================================
   MODALS
===================================================== */

function showModal(content){

  document.getElementById("modalContent").innerHTML=content;
  document.getElementById("modal").classList.add("show");

}


function closeModal(){

  document.getElementById("modal").classList.remove("show");

}


function modalBackground(event){

  if(event.target.id==="modal"){
    closeModal();
  }

}


function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2500);

}

</script>
