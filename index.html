<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fawnwood</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f4f0;
  color: #25251f;
}

header {
  height: 72px;
  background: #ffffff;
  border-bottom: 1px solid #e4e1db;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.logo {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-subtitle {
  color: #85837d;
  font-size: 14px;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 42px 24px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 32px;
}

h1 {
  margin: 0 0 6px;
  font-size: 32px;
}

.description {
  margin: 0;
  color: #85837d;
}

button {
  border: none;
  cursor: pointer;
  font: inherit;
}

.add-button {
  background: #25251f;
  color: white;
  padding: 13px 19px;
  border-radius: 9px;
  font-weight: 600;
}

.add-button:hover {
  opacity: .9;
}

.empty {
  background: white;
  border: 1px solid #e4e1db;
  border-radius: 14px;
  padding: 70px 20px;
  text-align: center;
}

.empty-icon {
  font-size: 36px;
  margin-bottom: 12px;
}

.empty h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.empty p {
  margin: 0;
  color: #85837d;
}

.profiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.profile {
  background: white;
  border: 1px solid #e4e1db;
  border-radius: 14px;
  padding: 20px;
}

.profile-name {
  font-size: 19px;
  font-weight: 650;
  margin-bottom: 14px;
}

.roles {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.role {
  background: #f0eee9;
  color: #5f5d56;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: 12px;
}

.delete {
  margin-top: 18px;
  background: transparent;
  color: #a35f5f;
  font-size: 13px;
  padding: 0;
}

.modal-background {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  width: 100%;
  max-width: 480px;
  background: white;
  border-radius: 16px;
  padding: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
}

.modal h2 {
  margin: 0 0 22px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d9d6cf;
  border-radius: 8px;
  font: inherit;
  outline: none;
}

input:focus {
  border-color: #88847b;
}

.role-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.role-option {
  border: 1px solid #dedbd4;
  background: #faf9f7;
  color: #45443e;
  padding: 10px;
  border-radius: 8px;
  text-align: left;
}

.role-option.selected {
  background: #25251f;
  color: white;
  border-color: #25251f;
}

.field {
  margin-bottom: 22px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.cancel {
  background: #eeeae4;
  padding: 11px 17px;
  border-radius: 8px;
}

.save {
  background: #25251f;
  color: white;
  padding: 11px 17px;
  border-radius: 8px;
  font-weight: 600;
}

@media (max-width: 600px) {
  header {
    padding: 0 18px;
  }

  .header-subtitle {
    display: none;
  }

  main {
    padding: 28px 16px;
  }

  .top {
    align-items: flex-start;
    flex-direction: column;
  }

  .add-button {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">fawnwood</div>
  <div class="header-subtitle">Staff management</div>
</header>

<main>

  <div class="top">
    <div>
      <h1>Profiles</h1>
      <p class="description">Manage your Fawnwood team.</p>
    </div>

    <button class="add-button" onclick="openModal()">
      + Add profile
    </button>
  </div>

  <div id="profiles"></div>

</main>

<div class="modal-background" id="modal">

  <div class="modal">

    <h2>Add profile</h2>

    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Enter a name">
    </div>

    <div class="field">
      <label>Job role(s)</label>

      <div class="role-options">

        <button class="role-option" onclick="toggleRole(this)">
          Reception
        </button>

        <button class="role-option" onclick="toggleRole(this)">
          Housekeeping
        </button>

        <button class="role-option" onclick="toggleRole(this)">
          Management
        </button>

        <button class="role-option" onclick="toggleRole(this)">
          Concierge
        </button>

        <button class="role-option" onclick="toggleRole(this)">
          Food & Beverage
        </button>

        <button class="role-option" onclick="toggleRole(this)">
          Maintenance
        </button>

      </div>
    </div>

    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveProfile()">Save profile</button>
    </div>

  </div>

</div>

<script>

let profiles = JSON.parse(localStorage.getItem("fawnwoodProfiles")) || [];

function renderProfiles() {

  const container = document.getElementById("profiles");

  if (profiles.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">♧</div>
        <h2>No profiles yet</h2>
        <p>Add your first Fawnwood profile to get started.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="profiles">
      ${profiles.map((profile, index) => `
        <div class="profile">

          <div class="profile-name">
            ${escapeHtml(profile.name)}
          </div>

          <div class="roles">
            ${profile.roles.map(role =>
              `<span class="role">${escapeHtml(role)}</span>`
            ).join("")}
          </div>

          <button class="delete" onclick="deleteProfile(${index})">
            Delete profile
          </button>

        </div>
      `).join("")}
    </div>
  `;
}

function openModal() {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("name").value = "";

  document.querySelectorAll(".role-option").forEach(button => {
    button.classList.remove("selected");
  });
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function toggleRole(button) {
  button.classList.toggle("selected");
}

function saveProfile() {

  const name = document.getElementById("name").value.trim();

  const selectedRoles = [
    ...document.querySelectorAll(".role-option.selected")
  ].map(button => button.textContent.trim());

  if (!name) {
    alert("Please enter a name.");
    return;
  }

  if (selectedRoles.length === 0) {
    alert("Please select at least one job role.");
    return;
  }

  profiles.push({
    name: name,
    roles: selectedRoles
  });

  localStorage.setItem(
    "fawnwoodProfiles",
    JSON.stringify(profiles)
  );

  closeModal();
  renderProfiles();
}

function deleteProfile(index) {

  if (!confirm("Delete this profile?")) {
    return;
  }

  profiles.splice(index, 1);

  localStorage.setItem(
    "fawnwoodProfiles",
    JSON.stringify(profiles)
  );

  renderProfiles();
}

function escapeHtml(text) {

  const div = document.createElement("div");
  div.textContent = text;

  return div.innerHTML;
}

renderProfiles();

</script>

</body>
</html>
