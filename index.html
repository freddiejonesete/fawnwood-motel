<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Fawnwood</title>

  <style>
    /* =====================================================
       FAWNWOOD — SECTION 1
       FOUNDATION / APP SHELL
    ===================================================== */

    :root {
      --background: #f6f5f1;
      --surface: #ffffff;
      --surface-soft: #f0efe9;

      --text: #25251f;
      --text-soft: #73726b;
      --text-faint: #9b9991;

      --border: #e5e2da;

      --primary: #30332d;
      --primary-hover: #22251f;

      --danger: #a45e5e;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;

      --shadow: 0 8px 30px rgba(30, 30, 25, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--background);
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--background);
      color: var(--text);

      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      min-height: 100vh;
    }

    /* =====================================================
       MOBILE HEADER
    ===================================================== */

    .mobile-header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: rgba(246, 245, 241, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.7px;
    }

    .header-button {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 12px;

      color: var(--text);
      font-size: 17px;
    }

    /* =====================================================
       DESKTOP SIDEBAR
    ===================================================== */

    .desktop-sidebar {
      display: none;
    }

    /* =====================================================
       MAIN CONTENT
    ===================================================== */

    .main {
      width: 100%;
      max-width: 1150px;

      margin: 0 auto;

      padding:
        28px
        16px
        calc(100px + env(safe-area-inset-bottom));
    }

    .page-heading {
      margin-bottom: 26px;
    }

    .page-title {
      font-size: 29px;
      line-height: 1.1;

      letter-spacing: -0.8px;

      font-weight: 750;
    }

    .page-description {
      margin-top: 7px;

      color: var(--text-soft);

      font-size: 14px;
      line-height: 1.5;
    }

    /* =====================================================
       PAGE SECTIONS
    ===================================================== */

    .section {
      margin-top: 26px;
    }

    .section-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* =====================================================
       CARDS
    ===================================================== */

    .card {
      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      box-shadow: var(--shadow);
    }

    .card-padding {
      padding: 17px;
    }

    /* =====================================================
       BUTTONS
    ===================================================== */

    .button-primary {
      min-height: 44px;

      padding: 0 16px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: var(--primary);
      color: white;

      border-radius: var(--radius-sm);

      font-size: 14px;
      font-weight: 650;

      transition: background 0.15s ease;
    }

    .button-primary:hover {
      background: var(--primary-hover);
    }

    .button-secondary {
      min-height: 44px;

      padding: 0 16px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: var(--surface-soft);
      color: var(--text);

      border-radius: var(--radius-sm);

      font-size: 14px;
      font-weight: 600;
    }

    .button-ghost {
      background: transparent;
      color: var(--text-soft);

      padding: 7px;

      font-size: 13px;
    }

    /* =====================================================
       DASHBOARD PLACEHOLDER
       ===================================================== */

    .welcome-card {
      padding: 22px;
    }

    .welcome-label {
      color: var(--text-faint);

      font-size: 12px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .welcome-title {
      margin-top: 7px;

      font-size: 23px;
      font-weight: 720;

      letter-spacing: -0.5px;
    }

    .welcome-text {
      margin-top: 7px;

      color: var(--text-soft);

      font-size: 13px;
      line-height: 1.5;
    }

    /* =====================================================
       STAT CARDS
    ===================================================== */

    .stats-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 10px;
    }

    .stat-card {
      padding: 16px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: 750;
    }

    .stat-label {
      margin-top: 4px;

      color: var(--text-soft);

      font-size: 12px;
    }

    /* =====================================================
       QUICK ACTIONS
    ===================================================== */

    .actions-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 10px;
    }

    .action-card {
      min-height: 105px;

      padding: 15px;

      text-align: left;

      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: var(--radius-md);

      box-shadow: var(--shadow);
    }

    .action-icon {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--surface-soft);

      border-radius: 9px;

      font-size: 15px;
    }

    .action-title {
      margin-top: 12px;

      font-size: 13px;
      font-weight: 700;
    }

    .action-description {
      margin-top: 3px;

      color: var(--text-soft);

      font-size: 11px;
    }

    /* =====================================================
       EMPTY STATES
    ===================================================== */

    .empty-state {
      padding: 42px 20px;

      text-align: center;
    }

    .empty-icon {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 13px;

      background: var(--surface-soft);

      border-radius: 13px;

      font-size: 19px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
    }

    .empty-description {
      max-width: 300px;

      margin: 6px auto 0;

      color: var(--text-soft);

      font-size: 13px;
      line-height: 1.5;
    }

    /* =====================================================
       FORM FOUNDATION
    ===================================================== */

    .form-group {
      margin-bottom: 17px;
    }

    .form-label {
      display: block;

      margin-bottom: 7px;

      font-size: 12px;
      font-weight: 650;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;

      padding: 12px;

      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: var(--radius-sm);

      color: var(--text);

      outline: none;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: #aaa69d;
    }

    .form-textarea {
      min-height: 100px;

      resize: vertical;
    }

    /* =====================================================
       MODAL FOUNDATION
    ===================================================== */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      z-index: 500;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background: rgba(20, 20, 17, 0.4);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;

      max-height: 90vh;

      overflow-y: auto;

      padding: 22px 18px;

      background: var(--surface);

      border-radius: 22px 22px 0 0;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 720;
    }

    .modal-description {
      margin-top: 5px;

      color: var(--text-soft);

      font-size: 13px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;

      gap: 9px;

      margin-top: 22px;
    }

    .modal-actions button {
      flex: 1;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));

      z-index: 1000;

      transform: translateX(-50%) translateY(10px);

      padding: 11px 15px;

      background: var(--primary);
      color: white;

      border-radius: 10px;

      font-size: 13px;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;

      transform: translateX(-50%) translateY(0);
    }

    /* =====================================================
       MOBILE BOTTOM NAVIGATION
    ===================================================== */

    .bottom-navigation {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 200;

      height: calc(68px + env(safe-area-inset-bottom));

      display: grid;

      grid-template-columns: repeat(5, 1fr);

      padding-bottom: env(safe-area-inset-bottom);

      background: rgba(255, 255, 255, 0.96);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border-top: 1px solid var(--border);
    }

    .navigation-button {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 4px;

      background: transparent;

      color: var(--text-faint);

      font-size: 10px;
      font-weight: 500;
    }

    .navigation-icon {
      font-size: 18px;

      line-height: 1;
    }

    .navigation-button.active {
      color: var(--text);

      font-weight: 700;
    }

    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 760px) {

      .mobile-header {
        display: none;
      }

      .desktop-sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        width: 235px;

        display: flex;

        flex-direction: column;

        padding: 28px 14px;

        background: var(--surface);

        border-right: 1px solid var(--border);

        z-index: 300;
      }

      .desktop-logo {
        padding: 0 12px 28px;

        font-size: 22px;
        font-weight: 750;

        letter-spacing: -0.7px;
      }

      .desktop-navigation {
        display: flex;

        flex-direction: column;

        gap: 3px;
      }

      .desktop-nav-button {
        width: 100%;

        padding: 11px 12px;

        display: flex;
        align-items: center;

        gap: 10px;

        background: transparent;

        color: var(--text-soft);

        border-radius: 10px;

        text-align: left;

        font-size: 13px;
        font-weight: 550;
      }

      .desktop-nav-button:hover {
        background: var(--surface-soft);
        color: var(--text);
      }

      .desktop-nav-button.active {
        background: var(--surface-soft);
        color: var(--text);

        font-weight: 700;
      }

      .main {
        margin-left: 235px;

        max-width: none;

        padding:
          40px
          40px
          60px;
      }

      .bottom-navigation {
        display: none;
      }

      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .actions-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .modal-backdrop {
        align-items: center;
      }

      .modal {
        border-radius: 18px;

        padding: 24px;
      }
    }

    /* =====================================================
       LARGE DESKTOP
    ===================================================== */

    @media (min-width: 1100px) {

      .main {
        padding-left: 55px;
        padding-right: 55px;
      }

      .page-title {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ===================================================
         DESKTOP SIDEBAR
    ==================================================== -->

    <aside class="desktop-sidebar">

      <div class="desktop-logo">
        fawnwood
      </div>

      <nav class="desktop-navigation">

        <button
          class="desktop-nav-button active"
          data-page="home"
          onclick="navigate('home')"
        >
          <span>⌂</span>
          <span>Home</span>
        </button>

        <button
          class="desktop-nav-button"
          data-page="staff"
          onclick="navigate('staff')"
        >
          <span>♙</span>
          <span>Staff</span>
        </button>

        <button
          class="desktop-nav-button"
          data-page="schedule"
          onclick="navigate('schedule')"
        >
          <span>▦</span>
          <span>Schedule</span>
        </button>

        <button
          class="desktop-nav-button"
          data-page="tasks"
          onclick="navigate('tasks')"
        >
          <span>✓</span>
          <span>Tasks</span>
        </button>

        <button
          class="desktop-nav-button"
          data-page="departments"
          onclick="navigate('departments')"
        >
          <span>◈</span>
          <span>Departments</span>
        </button>

        <button
          class="desktop-nav-button"
          data-page="announcements"
          onclick="navigate('announcements')"
        >
          <span>◌</span>
          <span>Announcements</span>
        </button>

        <button
          class="desktop-nav-button"
          data-page="reports"
          onclick="navigate('reports')"
        >
          <span>▥</span>
          <span>Reports</span>
        </button>

        <button
          class="desktop-nav-button"
          data-page="settings"
          onclick="navigate('settings')"
        >
          <span>⚙</span>
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- ===================================================
         MOBILE HEADER
    ==================================================== -->

    <header class="mobile-header">

      <div class="logo">
        fawnwood
      </div>

      <button
        class="header-button"
        onclick="navigate('settings')"
        aria-label="Settings"
      >
        ⚙
      </button>

    </header>


    <!-- ===================================================
         MAIN APPLICATION
    ==================================================== -->

    <main class="main" id="main">

      <!-- CONTENT IS INSERTED BY JAVASCRIPT -->

    </main>


    <!-- ===================================================
         MOBILE NAVIGATION
    ==================================================== -->

    <nav class="bottom-navigation">

      <button
        class="navigation-button active"
        data-page="home"
        onclick="navigate('home')"
      >
        <span class="navigation-icon">⌂</span>
        <span>Home</span>
      </button>

      <button
        class="navigation-button"
        data-page="staff"
        onclick="navigate('staff')"
      >
        <span class="navigation-icon">♙</span>
        <span>Staff</span>
      </button>

      <button
        class="navigation-button"
        data-page="schedule"
        onclick="navigate('schedule')"
      >
        <span class="navigation-icon">▦</span>
        <span>Schedule</span>
      </button>

      <button
        class="navigation-button"
        data-page="tasks"
        onclick="navigate('tasks')"
      >
        <span class="navigation-icon">✓</span>
        <span>Tasks</span>
      </button>

      <button
        class="navigation-button"
        data-page="more"
        onclick="navigate('more')"
      >
        <span class="navigation-icon">☰</span>
        <span>More</span>
      </button>

    </nav>


    <!-- ===================================================
         MODAL SYSTEM
    ==================================================== -->

    <div
      class="modal-backdrop"
      id="modalBackdrop"
      onclick="closeModalFromBackdrop(event)"
    >

      <div class="modal" id="modal">

        <!-- Modal content will be inserted here -->

      </div>

    </div>


    <!-- ===================================================
         TOAST SYSTEM
    ==================================================== -->

    <div
      class="toast"
      id="toast"
    ></div>

  </div>


  <script>

    /* =====================================================
       FAWNWOOD APPLICATION FOUNDATION
    ===================================================== */

    let currentPage = "home";


    /* =====================================================
       LOCAL STORAGE FOUNDATION

       These functions are ready for the profile system
       and application features in later sections.
    ===================================================== */

    const storage = {

      get(key, fallback = null) {

        try {

          const value = localStorage.getItem(
            "fawnwood_" + key
          );

          return value === null
            ? fallback
            : JSON.parse(value);

        } catch {

          return fallback;

        }

      },

      set(key, value) {

        localStorage.setItem(
          "fawnwood_" + key,
          JSON.stringify(value)
        );

      },

      remove(key) {

        localStorage.removeItem(
          "fawnwood_" + key
        );

      }

    };


    /* =====================================================
       NAVIGATION
    ===================================================== */

    function navigate(page) {

      currentPage = page;

      renderPage();

      updateNavigation();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function updateNavigation() {

      document
        .querySelectorAll("[data-page]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.page === currentPage
          );

        });

    }


    /* =====================================================
       PAGE RENDERING
    ===================================================== */

    function renderPage() {

      const main =
        document.getElementById("main");


      switch (currentPage) {

        case "home":
          renderHome(main);
          break;

        case "staff":
          renderPlaceholder(
            main,
            "Staff",
            "Your Fawnwood team will appear here."
          );
          break;

        case "schedule":
          renderPlaceholder(
            main,
            "Schedule",
            "Your staff schedule will appear here."
          );
          break;

        case "tasks":
          renderPlaceholder(
            main,
            "Tasks",
            "Your team tasks will appear here."
          );
          break;

        case "departments":
          renderPlaceholder(
            main,
            "Departments",
            "Your hotel departments will appear here."
          );
          break;

        case "announcements":
          renderPlaceholder(
            main,
            "Announcements",
            "Team announcements will appear here."
          );
          break;

        case "reports":
          renderPlaceholder(
            main,
            "Reports",
            "Your Fawnwood reports will appear here."
          );
          break;

        case "settings":
          renderPlaceholder(
            main,
            "Settings",
            "Fawnwood settings will appear here."
          );
          break;

        case "more":
          renderMore(main);
          break;

        default:
          renderHome(main);

      }

    }


    /* =====================================================
       HOME

       This is intentionally the foundation only.
       The dashboard will become personalised once the
       profile/login system exists.
    ===================================================== */

    function renderHome(main) {

      main.innerHTML = `

        <div class="page-heading">

          <h1 class="page-title">
            Welcome to Fawnwood
          </h1>

          <p class="page-description">
            Your hotel management workspace.
          </p>

        </div>


        <div class="card welcome-card">

          <div class="welcome-label">
            Fawnwood
          </div>

          <div class="welcome-title">
            Your workspace starts here.
          </div>

          <p class="welcome-text">
            Once your staff profiles are set up,
            this dashboard will become your personalised
            Fawnwood home.
          </p>

        </div>


        <section class="section">

          <div class="section-header">

            <h2 class="section-title">
              Overview
            </h2>

          </div>


          <div class="stats-grid">

            ${statCard("0", "Staff")}

            ${statCard("0", "Today's shifts")}

            ${statCard("0", "Open tasks")}

            ${statCard("0", "Announcements")}

          </div>

        </section>


        <section class="section">

          <div class="section-header">

            <h2 class="section-title">
              Quick actions
            </h2>

          </div>


          <div class="actions-grid">

            ${actionCard(
              "♙",
              "Add staff",
              "Create a profile",
              "staff"
            )}

            ${actionCard(
              "▦",
              "Schedule",
              "Manage shifts",
              "schedule"
            )}

            ${actionCard(
              "✓",
              "Create task",
              "Assign work",
              "tasks"
            )}

            ${actionCard(
              "◌",
              "Announcement",
              "Update your team",
              "announcements"
            )}

          </div>

        </section>


        <section class="section">

          <div class="section-header">

            <h2 class="section-title">
              Getting started
            </h2>

          </div>


          <div class="card">

            <div class="empty-state">

              <div class="empty-icon">
                ✓
              </div>

              <div class="empty-title">
                Fawnwood is ready to be set up
              </div>

              <p class="empty-description">
                The next step is creating the profile
                system that appears before the application.
              </p>

            </div>

          </div>

        </section>

      `;

    }


    /* =====================================================
       STAT CARD
    ===================================================== */

    function statCard(number, label) {

      return `

        <div class="card stat-card">

          <div class="stat-number">
            ${number}
          </div>

          <div class="stat-label">
            ${label}
          </div>

        </div>

      `;

    }


    /* =====================================================
       ACTION CARD
    ===================================================== */

    function actionCard(
      icon,
      title,
      description,
      page
    ) {

      return `

        <button
          class="action-card"
          onclick="navigate('${page}')"
        >

          <div class="action-icon">
            ${icon}
          </div>

          <div class="action-title">
            ${title}
          </div>

          <div class="action-description">
            ${description}
          </div>

        </button>

      `;

    }


    /* =====================================================
       PLACEHOLDER PAGES

       These become the real sections later.
    ===================================================== */

    function renderPlaceholder(
      main,
      title,
      description
    ) {

      main.innerHTML = `

        <div class="page-heading">

          <h1 class="page-title">
            ${title}
          </h1>

          <p class="page-description">
            ${description}
          </p>

        </div>


        <div class="card">

          <div class="empty-state">

            <div class="empty-icon">
              ◇
            </div>

            <div class="empty-title">
              Coming next
            </div>

            <p class="empty-description">
              This section is part of the Fawnwood
              foundation and will be built in the
              next development sections.
            </p>

          </div>

        </div>

      `;

    }


    /* =====================================================
       MORE PAGE — MOBILE
    ===================================================== */

    function renderMore(main) {

      main.innerHTML = `

        <div class="page-heading">

          <h1 class="page-title">
            More
          </h1>

          <p class="page-description">
            More Fawnwood tools and settings.
          </p>

        </div>


        <div class="actions-grid">

          ${actionCard(
            "◈",
            "Departments",
            "Manage departments",
            "departments"
          )}

          ${actionCard(
            "◌",
            "Announcements",
            "Team updates",
            "announcements"
          )}

          ${actionCard(
            "▥",
            "Reports",
            "View reports",
            "reports"
          )}

          ${actionCard(
            "⚙",
            "Settings",
            "Manage Fawnwood",
            "settings"
          )}

        </div>

      `;

    }


    /* =====================================================
       MODAL SYSTEM
    ===================================================== */

    function openModal(content) {

      const backdrop =
        document.getElementById(
          "modalBackdrop"
        );

      const modal =
        document.getElementById(
          "modal"
        );

      modal.innerHTML = content;

      backdrop.classList.add("open");

      document.body.style.overflow = "hidden";

    }


    function closeModal() {

      const backdrop =
        document.getElementById(
          "modalBackdrop"
        );

      backdrop.classList.remove("open");

      document.body.style.overflow = "";

    }


    function closeModalFromBackdrop(event) {

      if (
        event.target.id ===
        "modalBackdrop"
      ) {

        closeModal();

      }

    }


    /* =====================================================
       TOAST SYSTEM
    ===================================================== */

    let toastTimeout;


    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );

      toast.textContent = message;

      toast.classList.add("show");

      clearTimeout(toastTimeout);

      toastTimeout =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 2200);

    }


    /* =====================================================
       INITIALISE
    ===================================================== */

    renderPage();

    updateNavigation();

  </script>

<script>

/* =====================================================
   FAWNWOOD SECTION 2
   PROFILE / LOGIN FOUNDATION
===================================================== */


/* =====================================================
   ROLES
===================================================== */

const roles = [
"Reception",
"Housekeeping",
"Management",
"Concierge",
"Food & Beverage",
"Maintenance"
];


/* =====================================================
   PROFILE STORAGE
===================================================== */

let profiles =
JSON.parse(
localStorage.getItem("fawnwood_profiles") || "[]"
);


/* =====================================================
   CURRENT USER
===================================================== */

let currentUser =
JSON.parse(
sessionStorage.getItem("fawnwood_current_user") || "null"
);


/* =====================================================
   CURRENT PAGE
===================================================== */

let currentPage = "home";


/* =====================================================
   HELPERS
===================================================== */

function saveProfiles(){

localStorage.setItem(
"fawnwood_profiles",
JSON.stringify(profiles)
);

}


function initials(name){

return name
.split(/\s+/)
.filter(Boolean)
.slice(0,2)
.map(part => part[0])
.join("")
.toUpperCase();

}


function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   PROFILE SCREEN
===================================================== */

function renderProfiles(){

const container =
document.getElementById("profileList");


if(profiles.length === 0){

container.innerHTML = `

<div class="profile-empty">

<div class="profile-empty-icon">
♙
</div>

<div class="profile-empty-title">
No profiles yet
</div>

<div class="profile-empty-text">
Create your first Fawnwood profile
to get started.
</div>

</div>

`;

return;

}


container.innerHTML = profiles
.map((profile,index)=>`

<button
class="profile-card"
onclick="selectProfile(${index})"
>

<div class="profile-avatar">
${initials(profile.name)}
</div>

<div class="profile-info">

<div class="profile-name">
${escapeHTML(profile.name)}
</div>

<div class="profile-roles">
${profile.roles.map(escapeHTML).join(" · ")}
</div>

</div>

<div class="profile-arrow">
›
</div>

</button>

`)
.join("");

}


/* =====================================================
   ADD PROFILE
===================================================== */

function openAddProfile(){

openProfileModal();

}


/* =====================================================
   EDIT PROFILE
===================================================== */

function openEditProfile(index){

openProfileModal(index);

}


/* =====================================================
   PROFILE MODAL
===================================================== */

function openProfileModal(index=null){

const editing =
index !== null;

const profile =
editing
? profiles[index]
: {
name:"",
roles:[]
};


openModal(`

<div class="modal-title">

${editing
? "Edit profile"
: "Create your profile"}

</div>

<div class="modal-description">

${editing
? "Update this Fawnwood profile."
: "Set up a profile to enter Fawnwood."}

</div>


<div class="form-group">

<label class="form-label">
Name
</label>

<input
id="profileName"
class="form-input"
type="text"
placeholder="Enter name"
value="${escapeHTML(profile.name)}"
/>

</div>


<div class="form-group">

<label class="form-label">
Job role(s)
</label>

<div class="role-grid">

${roles.map(role=>`

<button
type="button"
class="role-button ${
profile.roles.includes(role)
? "selected"
: ""
}"
onclick="toggleRole(this)"
>
${role}
</button>

`).join("")}

</div>

</div>


<div class="modal-actions">

<button
class="button-secondary"
onclick="closeModal()"
>
Cancel
</button>

<button
class="button-primary"
onclick="saveProfile(${editing ? index : "null"})"
>
${editing ? "Save changes" : "Create profile"}
</button>

</div>


${editing ? `

<button
class="button-danger"
onclick="deleteProfile(${index})"
>
Delete profile
</button>

` : ""}

`);

}


/* =====================================================
   ROLE SELECTION
===================================================== */

function toggleRole(button){

button.classList.toggle("selected");

}


/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile(index){

const name =
document
.getElementById("profileName")
.value
.trim();


const selectedRoles =
[
...document.querySelectorAll(
".role-button.selected"
)
]
.map(button =>
button.textContent.trim()
);


if(!name){

showToast("Please enter a name.");

return;

}


if(selectedRoles.length === 0){

showToast("Choose at least one role.");

return;

}


const profile = {

name:name,

roles:selectedRoles

};


if(index === null){

profiles.push(profile);

showToast("Profile created.");

}else{

profiles[index] = profile;

showToast("Profile updated.");

}


saveProfiles();

closeModal();

renderProfiles();

}


/* =====================================================
   DELETE PROFILE
===================================================== */

function deleteProfile(index){

if(
!confirm(
"Delete this profile?"
)
){

return;

}


const deleted =
profiles[index];


profiles.splice(index,1);

saveProfiles();

closeModal();

renderProfiles();

showToast(
`${deleted.name} deleted.`
);

}


/* =====================================================
   SELECT PROFILE
===================================================== */

function selectProfile(index){

currentUser =
profiles[index];


sessionStorage.setItem(
"fawnwood_current_user",
JSON.stringify(currentUser)
);


enterApplication();

}


/* =====================================================
   ENTER APPLICATION
===================================================== */

function enterApplication(){

if(!currentUser){

showProfileScreen();

return;

}


document
.getElementById("profileScreen")
.classList.add("hidden");


document
.getElementById("application")
.classList.remove("hidden");


document
.getElementById("mobileUserAvatar")
.textContent =
initials(currentUser.name);


renderPage();

updateNavigation();

}


/* =====================================================
   SWITCH PROFILE
===================================================== */

function switchProfile(){

sessionStorage.removeItem(
"fawnwood_current_user"
);

currentUser = null;

document
.getElementById("application")
.classList.add("hidden");

document
.getElementById("profileScreen")
.classList.remove("hidden");

renderProfiles();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   PROFILE SCREEN
===================================================== */

function showProfileScreen(){

document
.getElementById("application")
.classList.add("hidden");

document
.getElementById("profileScreen")
.classList.remove("hidden");

renderProfiles();

}


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(page){

currentPage = page;

renderPage();

updateNavigation();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function updateNavigation(){

document
.querySelectorAll("[data-page]")
.forEach(button=>{

button.classList.toggle(
"active",
button.dataset.page === currentPage
);

});

}


/* =====================================================

===================================================== */

function renderPage(){

const main =
document.getElementById("main");


switch(currentPage){

case "home":
renderHome(main);
break;

case "staff":
renderPlaceholder(
main,
"Staff",
"Your Fawnwood team."
);
break;

case "schedule":

main,
"Schedule",
"Your staff schedule."

break;

case "tasks":
renderPlaceholder(
main,
"Tasks",
"Your team's tasks."
);
break;

case "departments":
renderPlaceholder(
main,
"Departments",
"Your hotel departments."
);
break;

case "announcements":
renderPlaceholder(
main,
"Announcements",
"Updates for your team."
);
break;

case "reports":
renderPlaceholder(
main,
"Reports",
"Fawnwood reports."
);
break;

case "settings":
renderSettings(main);
break;

case "more":
renderMore(main);
break;

default:
renderHome(main);

}

}

/* =====================================================

===================================================== */

function getGreeting(){

const hour =
new Date().getHours();

if(hour < 12)
return "morning";

if(hour < 18)
return "afternoon";

return "evening";

}

/* =====================================================
   EDIT CURRENT PROFILE
===================================================== */

function openEditCurrentProfile(){

const index =
profiles.findIndex(
profile =>
profile.name === currentUser.name &&
JSON.stringify(profile.roles) ===
JSON.stringify(currentUser.roles)
);

if(index === -1){

showToast("Profile not found.");

return;

}

openProfileModal(index);

}

/* =====================================================
   MODAL
===================================================== */

function openModal(content){

document
.getElementById("modal")
.innerHTML = content;

document
.getElementById("modalBackdrop")
.classList.add("open");

document.body.style.overflow="hidden";

}


function closeModal(){

document
.getElementById("modalBackdrop")
.classList.remove("open");

document.body.style.overflow="";

}


function closeModalBackdrop(event){

if(
event.target.id ===
"modalBackdrop"
){

closeModal();

}

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

const toast =
document.getElementById("toast");

toast.textContent = message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer =
setTimeout(
()=>{
toast.classList.remove("show");
},
2200
);

}


/* =====================================================
   INITIALISE

renderProfiles();


if(currentUser){

enterApplication();

}else{

showProfileScreen();
