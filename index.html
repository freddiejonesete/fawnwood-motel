<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>fawnwood — Hotel Operations</title>

<style>
:root{
  --forest:#123c2d;
  --forest-2:#1c503e;
  --forest-3:#2b6751;
  --cream:#f5f3ee;
  --paper:#ffffff;
  --ink:#1d2823;
  --muted:#77817c;
  --line:#e4e6e2;
  --soft:#eef1ed;
  --gold:#b08a50;
  --danger:#b94b45;
  --warning:#b87932;
  --success:#397653;
  --radius:22px;
  --shadow:0 12px 35px rgba(20,40,31,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* --------------------------------------------------
   APP SHELL
-------------------------------------------------- */

#app{
  min-height:100vh;
}

.screen{
  min-height:100vh;
  padding-bottom:105px;
}

.container{
  width:min(1180px,100%);
  margin:0 auto;
  padding:20px;
}

@media(max-width:600px){
  .container{
    padding:16px;
  }
}

/* --------------------------------------------------
   LOGIN
-------------------------------------------------- */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(25px + env(safe-area-inset-top))
    18px
    calc(25px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 75% 15%,rgba(255,255,255,.20),transparent 30%),
    linear-gradient(145deg,#123c2d 0%,#245d49 48%,#d7dfd9 120%);
}

.login-card{
  width:min(590px,100%);
  background:rgba(255,255,255,.97);
  border-radius:32px;
  padding:30px;
  box-shadow:0 30px 80px rgba(0,0,0,.18);
}

.brand-mark{
  width:68px;
  height:68px;
  border-radius:21px;
  background:var(--forest);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  font-weight:800;
  margin-bottom:22px;
}

.brand-name{
  margin:0;
  font-size:34px;
  letter-spacing:-1.5px;
}

.brand-subtitle{
  margin:5px 0 32px;
  color:var(--muted);
  font-size:16px;
}

.login-title{
  font-size:23px;
  margin:0 0 14px;
}

.profile-list{
  display:grid;
  gap:11px;
}

.profile-card{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:19px;
  padding:17px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:14px;
  transition:.18s ease;
}

.profile-card:active{
  transform:scale(.985);
}

.profile-avatar{
  flex:0 0 48px;
  width:48px;
  height:48px;
  border-radius:16px;
  background:var(--forest);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:19px;
}

.profile-info{
  min-width:0;
}

.profile-name{
  font-size:17px;
  font-weight:750;
}

.profile-username{
  color:var(--muted);
  font-size:14px;
  margin-top:3px;
}

.profile-role{
  display:inline-block;
  margin-top:7px;
  font-size:12px;
  font-weight:700;
  padding:5px 8px;
  background:var(--soft);
  border-radius:8px;
}

.login-status{
  margin-top:15px;
  min-height:18px;
  color:var(--muted);
  font-size:13px;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(245,243,238,.92);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(228,230,226,.75);
  padding-top:env(safe-area-inset-top);
}

.topbar-inner{
  width:min(1180px,100%);
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 20px;
}

.header-brand{
  min-width:0;
}

.header-brand strong{
  display:block;
  font-size:20px;
  letter-spacing:-.5px;
}

.header-brand span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-button{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:14px;
  background:white;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.avatar-small{
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--forest);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

/* --------------------------------------------------
   TITLES
-------------------------------------------------- */

.page-heading{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  margin:8px 0 22px;
}

.page-heading h1{
  margin:0;
  font-size:31px;
  letter-spacing:-1.2px;
}

.page-heading p{
  margin:6px 0 0;
  color:var(--muted);
}

@media(max-width:600px){
  .page-heading h1{
    font-size:27px;
  }
}

/* --------------------------------------------------
   CARDS
-------------------------------------------------- */

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card-pad{
  padding:20px;
}

.section-title{
  margin:0 0 13px;
  font-size:17px;
  letter-spacing:-.2px;
}

.section-subtitle{
  margin:-6px 0 15px;
  color:var(--muted);
  font-size:13px;
}

/* --------------------------------------------------
   DASHBOARD
-------------------------------------------------- */

.welcome-card{
  background:var(--forest);
  color:white;
  border-radius:25px;
  padding:22px;
  margin-bottom:16px;
}

.welcome-card .muted{
  color:rgba(255,255,255,.72);
}

.welcome-card h2{
  margin:4px 0 6px;
  font-size:25px;
}

.welcome-card p{
  margin:0;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat-card{
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:17px;
}

.stat-number{
  font-size:27px;
  font-weight:800;
  letter-spacing:-1px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

@media(max-width:700px){
  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.quick-action{
  min-height:120px;
  border:1px solid var(--line);
  background:white;
  border-radius:21px;
  padding:17px;
  text-align:left;
  box-shadow:var(--shadow);
}

.quick-action strong{
  display:block;
  margin-top:14px;
}

.quick-action span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  line-height:1.35;
}

.quick-icon{
  width:39px;
  height:39px;
  border-radius:13px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--forest);
}

@media(max-width:650px){
  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* --------------------------------------------------
   ICONS
-------------------------------------------------- */

svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* --------------------------------------------------
   BUTTONS
-------------------------------------------------- */

.btn{
  border:0;
  border-radius:14px;
  min-height:46px;
  padding:0 17px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.16s ease;
}

.btn:active{
  transform:scale(.98);
}

.btn-primary{
  background:var(--forest);
  color:white;
}

.btn-secondary{
  background:var(--soft);
  color:var(--ink);
}

.btn-outline{
  background:white;
  color:var(--ink);
  border:1px solid var(--line);
}

.btn-danger{
  background:#f8e9e7;
  color:var(--danger);
}

.btn-small{
  min-height:38px;
  padding:0 12px;
  font-size:13px;
}

.full{
  width:100%;
}

/* --------------------------------------------------
   BOTTOM NAV
-------------------------------------------------- */

.bottom-nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));
  pointer-events:none;
}

.bottom-nav-inner{
  width:min(680px,100%);
  margin:auto;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(210,214,210,.9);
  box-shadow:0 10px 40px rgba(0,0,0,.14);
  border-radius:22px;
  padding:6px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  pointer-events:auto;
}

.nav-item{
  min-width:0;
  min-height:57px;
  border:0;
  background:transparent;
  border-radius:17px;
  color:#737b76;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  font-weight:650;
}

.nav-item svg{
  width:19px;
  height:19px;
}

.nav-item.active{
  background:var(--forest);
  color:white;
}

/* --------------------------------------------------
   FORMS
-------------------------------------------------- */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.form-field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-field.full-width{
  grid-column:1/-1;
}

.form-field label{
  font-size:12px;
  font-weight:750;
  color:#56615b;
}

.form-field input,
.form-field select,
.form-field textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fbfbfa;
  border-radius:14px;
  min-height:49px;
  padding:12px 14px;
  color:var(--ink);
  outline:none;
}

.form-field textarea{
  min-height:100px;
  resize:vertical;
}

.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus{
  border-color:var(--forest-3);
  box-shadow:0 0 0 3px rgba(43,103,81,.09);
}

@media(max-width:650px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .form-field.full-width{
    grid-column:auto;
  }
}

/* --------------------------------------------------
   AI CHECK-IN
-------------------------------------------------- */

.ai-checkin{
  max-width:760px;
  margin:0 auto;
}

.ai-header{
  background:var(--forest);
  color:white;
  border-radius:25px 25px 0 0;
  padding:21px;
}

.ai-header-top{
  display:flex;
  align-items:center;
  gap:13px;
}

.ai-avatar{
  width:46px;
  height:46px;
  background:white;
  color:var(--forest);
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:850;
}

.ai-header strong{
  display:block;
}

.ai-header span{
  display:block;
  margin-top:3px;
  color:rgba(255,255,255,.7);
  font-size:12px;
}

.chat-window{
  background:white;
  border:1px solid var(--line);
  border-top:0;
  padding:18px;
  min-height:390px;
  max-height:calc(100vh - 260px);
  overflow:auto;
}

.message{
  display:flex;
  margin-bottom:13px;
}

.message.user{
  justify-content:flex-end;
}

.message-bubble{
  max-width:84%;
  padding:12px 14px;
  border-radius:17px;
  font-size:14px;
  line-height:1.42;
}

.message.ai .message-bubble{
  background:var(--soft);
  border-bottom-left-radius:6px;
}

.message.user .message-bubble{
  background:var(--forest);
  color:white;
  border-bottom-right-radius:6px;
}

.ai-controls{
  background:white;
  border:1px solid var(--line);
  border-top:0;
  padding:13px;
  border-radius:0 0 25px 25px;
}

.ai-choice-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.ai-choice{
  min-height:50px;
  border:1px solid var(--line);
  background:white;
  border-radius:14px;
  font-weight:700;
  padding:10px;
}

.ai-choice.selected{
  border-color:var(--forest);
  background:#edf4ef;
  color:var(--forest);
}

.ai-input-row{
  display:flex;
  gap:8px;
}

.ai-input-row input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 14px;
  min-height:49px;
}

.ai-send{
  flex:0 0 50px;
  width:50px;
  min-height:49px;
  border:0;
  border-radius:14px;
  background:var(--forest);
  color:white;
}

.checkin-summary{
  margin-top:15px;
  padding:17px;
  border-radius:18px;
  background:#f7f8f6;
  border:1px solid var(--line);
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0;
  font-size:14px;
}

.summary-row span:first-child{
  color:var(--muted);
}

.summary-total{
  border-top:1px solid var(--line);
  margin-top:7px;
  padding-top:12px;
  font-weight:800;
  font-size:17px;
}

.room-recommendation{
  margin-top:15px;
  border:1px solid #cfded3;
  background:#f0f6f1;
  border-radius:18px;
  padding:16px;
}

.room-recommendation strong{
  color:var(--forest);
  font-size:18px;
}

/* --------------------------------------------------
   ROOM MAP
-------------------------------------------------- */

.room-toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.room-map{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.room-tile{
  min-height:120px;
  border-radius:18px;
  padding:13px;
  text-align:left;
  border:1px solid var(--line);
  background:white;
  box-shadow:0 6px 18px rgba(20,40,31,.05);
}

.room-number{
  font-size:18px;
  font-weight:850;
}

.room-name{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-type{
  font-size:11px;
  margin-top:10px;
  color:#657069;
}

.room-status{
  display:inline-block;
  margin-top:9px;
  font-size:10px;
  font-weight:800;
  padding:5px 7px;
  border-radius:7px;
}

.status-available{
  background:#e8f3eb;
  color:#397653;
}

.status-occupied{
  background:#f5e8df;
  color:#986039;
}

.status-cleaning{
  background:#ece9f5;
  color:#66548b;
}

.status-maintenance{
  background:#f6e8e7;
  color:#a34d47;
}

@media(max-width:700px){
  .room-map{
    grid-template-columns:repeat(2,1fr);
  }
}

/* --------------------------------------------------
   TABLE / LISTS
-------------------------------------------------- */

.list{
  display:grid;
  gap:9px;
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px;
  border:1px solid var(--line);
  background:white;
  border-radius:17px;
}

.list-main{
  min-width:0;
}

.list-main strong{
  display:block;
}

.list-main span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.badge{
  flex:0 0 auto;
  border-radius:8px;
  padding:6px 8px;
  font-size:10px;
  font-weight:800;
  background:var(--soft);
}

.badge.green{
  background:#e7f2ea;
  color:#397653;
}

.badge.orange{
  background:#f6ecdf;
  color:#99622e;
}

.badge.red{
  background:#f7e8e7;
  color:#a24b45;
}

/* --------------------------------------------------
   DASHBOARD SPLIT
-------------------------------------------------- */

.two-col{
  display:grid;
  grid-template-columns:1.35fr .9fr;
  gap:15px;
}

@media(max-width:800px){
  .two-col{
    grid-template-columns:1fr;
  }
}

/* --------------------------------------------------
   MODAL
-------------------------------------------------- */

.modal-layer{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(12,25,19,.42);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:27px;
  box-shadow:0 30px 80px rgba(0,0,0,.22);
}

.modal-head{
  position:sticky;
  top:0;
  background:white;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:19px;
  border-bottom:1px solid var(--line);
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.modal-body{
  padding:19px;
}

.modal-actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  margin-top:18px;
}

@media(max-width:600px){
  .modal{
    max-height:94vh;
  }

  .modal-actions{
    flex-direction:column-reverse;
  }

  .modal-actions .btn{
    width:100%;
  }
}

/* --------------------------------------------------
   EMPTY STATE
-------------------------------------------------- */

.empty{
  text-align:center;
  padding:35px 20px;
  color:var(--muted);
}

.empty strong{
  display:block;
  color:var(--ink);
  margin-bottom:6px;
}

/* --------------------------------------------------
   TOAST
-------------------------------------------------- */

#toast-container{
  position:fixed;
  z-index:200;
  top:calc(15px + env(safe-area-inset-top));
  left:15px;
  right:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  pointer-events:none;
}

.toast{
  background:#1d2823;
  color:white;
  border-radius:14px;
  padding:12px 15px;
  font-size:13px;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
  animation:toastIn .2s ease;
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* --------------------------------------------------
   PAYMENT
-------------------------------------------------- */

.payment-methods{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.payment-method{
  border:1px solid var(--line);
  background:white;
  border-radius:14px;
  padding:13px 8px;
  text-align:center;
  font-weight:700;
}

.payment-method.active{
  background:#edf4ef;
  border-color:var(--forest);
  color:var(--forest);
}

/* --------------------------------------------------
   POS
-------------------------------------------------- */

.pos-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.pos-item{
  border:1px solid var(--line);
  background:white;
  border-radius:17px;
  padding:15px;
  text-align:left;
}

.pos-item strong{
  display:block;
}

.pos-item span{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.pos-price{
  margin-top:12px;
  font-weight:800;
}

@media(max-width:650px){
  .pos-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* --------------------------------------------------
   RESPONSIVE
-------------------------------------------------- */

@media(max-width:500px){
  .container{
    padding:14px;
  }

  .login-card{
    padding:23px;
    border-radius:27px;
  }

  .login-screen{
    align-items:flex-start;
    padding-top:70px;
  }

  .card-pad{
    padding:16px;
  }

  .stats-grid{
    gap:9px;
  }

  .stat-card{
    padding:14px;
  }

/* --------------------------------------------------

-------------------------------------------------- */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  return "£" + Number(value || 0).toFixed(2);
}

function uid(prefix="id"){
  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,7)
  );
}

function today(){
  return new Date().toISOString();
}

function showToast(message){
  const container =
    document.getElementById("toast-container");

  const toast =
    document.createElement("div");

  toast.className="toast";
  toast.textContent=message;

  container.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },3000);
}

function initials(name){
  return String(name || "F")
    .trim()
    .split(/\s+/)
    .map(x=>x[0])
    .join("")
    .slice(0,2)
    .toUpperCase();
}

function roleList(profile){
  if(!profile) return [];
  if(Array.isArray(profile.roles)) return profile.roles;
  if(typeof profile.roles === "string"){
    return profile.roles
      .replace(/[{}]/g,"")
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);
  }
  return [];
}

function isManager(){
  return roleList(state.currentProfile)
    .some(r=>String(r).toLowerCase()==="manager");
}

function logActivity(type,message){
  state.activity.unshift({
    id:uid("activity"),
    type,
    message,
    createdAt:today()
  });

  state.activity =
    state.activity.slice(0,100);

  saveState();
}

async function loadProfiles(){

  const status =
    document.querySelector(".login-status");

  try{

    if(!supabaseClient){
      renderLogin([]);
      return;
    }

    const {
      data,
      error
    } = await supabaseClient
      .from("staff")
      .select("id,name,username,roles,active")
      .eq("active",true)
      .order("name");

    if(error){
      console.error(error);
      renderLogin([]);
      return;
    }

    renderLogin(data || []);

  }catch(error){
    console.error(error);
    renderLogin([]);
  }
}

/* --------------------------------------------------
   ROOM MATCHING
-------------------------------------------------- */

function roomTypeRank(type){

  const ranks={
    Standard:1,
    Deluxe:2,
    Suite:3
  };

  return ranks[type] || 1;
}

function findBestRoom(requestedType){

  const requestedRank =
    roomTypeRank(requestedType);

  const available =
    state.rooms.filter(
      room=>room.status==="available"
    );

  if(!available.length) return null;

  /*
    The system does NOT simply pick randomly.

    It first looks for the requested room type.
    If unavailable, it chooses the closest
    suitable available type.
  */

  const exact =
    available
      .filter(
        r=>r.type===requestedType
      )
      .sort(
        (a,b)=>a.price-b.price
      );

  if(exact.length){
    return exact[0];
  }

  const suitable =
    available
      .slice()
      .sort((a,b)=>{

        const distanceA =
          Math.abs(
            roomTypeRank(a.type)-requestedRank
          );

        const distanceB =
          Math.abs(
            roomTypeRank(b.type)-requestedRank
          );

        if(distanceA!==distanceB){
          return distanceA-distanceB;
        }

        return a.price-b.price;
      });

  return suitable[0] || null;
}

        </strong>
      </div>

        <strong>

        </strong>

window.continueToPayment = function(){

  if(!state.checkin.room){

    showToast(
      "There isn't a suitable available room."
    );

    return;
  }

  state.checkin.step="payment";

  saveState();
  renderApp();
};

window.selectPayment = function(method){

  state.checkin.paymentMethod=method;

  saveState();
  renderApp();
};

window.completeCheckin = function(){

  const c=state.checkin;

  if(!c.room){
    showToast("No room selected.");
    return;
  }

  if(!c.paymentMethod){
    showToast("Select a payment method.");
    return;
  }

  const room =
    state.rooms.find(
      r=>r.id===c.room.id
    );

  if(!room || room.status!=="available"){

    showToast(
      "That room is no longer available."
    );

    return;
  }

  const guest={
    id:uid("guest"),
    name:c.name,
    title:c.title,
    username:"",
    createdAt:today()
  };

  const roomCost =
    Number(room.price)*Number(c.nights);

  const boardCost =
    c.boardBasis==="B&B"
      ? Number(c.nights)*15
      : c.boardBasis==="B&B + Evening Meal"
        ? Number(c.nights)*35
        : 0;

  const total =
    roomCost+boardCost;

  const stay={
    id:uid("stay"),
    guestId:guest.id,
    roomId:room.id,
    guestName:guest.name,
    roomNumber:room.number,
    roomType:room.type,
    nights:Number(c.nights),
    boardBasis:c.boardBasis,
    roomCost,
    boardCost,
    total,
    paymentMethod:c.paymentMethod,
    checkedInAt:today(),
    status:"active"
  };

  state.guests.unshift(guest);
  state.stays.unshift(stay);

  room.status="occupied";
  room.guestId=guest.id;

  state.charges.unshift({
    id:uid("charge"),
    stayId:stay.id,
    guestId:guest.id,
    category:"Room",
    description:`Room ${room.number} — ${c.nights} night(s)`,
    amount:total,
    createdAt:today()
  });

  logActivity(
    "checkin",
    `${guest.name} checked into room ${room.number}`
  );

  state.checkin.step="complete";

  saveState();
  renderApp();
};

window.saveRoom=function(id){

  if(!isManager()) return;

  const number =
    document.getElementById("room-number")
      .value.trim();

  const name =
    document.getElementById("room-name")
      .value.trim();

  const type =
    document.getElementById("room-type")
      .value;

  const price =
    Number(
      document.getElementById("room-price")
        .value
    );

  if(!number || !name){
    showToast("Enter the room number and name.");
    return;
  }

  if(id){

    const room =
      state.rooms.find(r=>r.id===id);

    if(room){

      room.number=number;
      room.name=name;
      room.type=type;
      room.price=price;

    }

  }else{

    state.rooms.push({
      id:uid("room"),
      number,
      name,
      type,
      price,
      status:"available",
      guestId:null
    });

  }

  logActivity(
    "room",
    id
      ? `Room ${number} updated`
      : `Room ${number} created`
  );

  saveState();

  closeModal();
  renderApp();
};

function calculateStayBalance(stay){

  const charges =
    state.charges
      .filter(
        c=>c.stayId===stay.id
      )
      .reduce(
        (sum,c)=>sum+Number(c.amount||0),
        0
      );

  return charges;
}

window.openCheckout=function(stayId){

  const stay =
    state.stays.find(
      s=>s.id===stayId
    );

  if(!stay) return;

  const charges =
    state.charges.filter(
      c=>c.stayId===stay.id
    );

  const total =
    charges.reduce(
      (sum,c)=>sum+Number(c.amount||0),
      0
    );

  openModal(
    "Check out guest",
    `

      <div class="checkin-summary">

        <div class="summary-row">
          <span>Guest</span>
          <strong>
            ${escapeHTML(stay.guestName)}
          </strong>
        </div>

        <div class="summary-row">
          <span>Room</span>
          <strong>${escapeHTML(stay.roomNumber)}</strong>
        </div>

        <div class="summary-row">
          <span>Board</span>
          <strong>${escapeHTML(stay.boardBasis)}</strong>
        </div>

        ${
          charges.map(c=>`

            <div class="summary-row">

              <span>
                ${escapeHTML(c.description)}
              </span>

              <strong>
                ${money(c.amount)}
              </strong>

            </div>

          `).join("")
        }

        <div class="summary-row summary-total">
          <span>Total</span>
          <strong>${money(total)}</strong>
        </div>

      </div>

      <div class="modal-actions">

        <button
          class="btn btn-outline"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="btn btn-primary"
          onclick="completeCheckout('${stay.id}')"
        >
          Complete check-out
        </button>

      </div>

    `
  );
};

window.completeCheckout=function(stayId){

  const stay =
    state.stays.find(
      s=>s.id===stayId
    );

  if(!stay) return;

  stay.status="completed";
  stay.checkedOutAt=today();

  const room =
    state.rooms.find(
      r=>r.id===stay.roomId
    );

  if(room){

    room.status="cleaning";
    room.guestId=null;

  }

  logActivity(
    "checkout",
    `${stay.guestName} checked out of room ${stay.roomNumber}`
  );

  saveState();

  closeModal();
  renderApp();

  showToast(
    `Room ${stay.roomNumber} sent to housekeeping.`
  );
};

window.openPOSCharge=function(type){

      "There are no active guest stays."
    );

    return;
  }

  const labels={
    restaurant:"Restaurant",
    "room-service":"Room service",
    spa:"Spa",
    other:"Other service",
    concierge:"Concierge",
    manual:"Manual charge"
  };

  const category =
    labels[type] || "Service";

  openModal(
    category,
    `

      <div class="form-field">

        <label>Guest stay</label>

        <select id="charge-stay">

          ${active.map(s=>`

          id="charge-description"

        >

      <div class="form-field" style="margin-top:12px">

        <label>Amount</label>

        <input
          id="charge-amount"
          type="number"
          min="0"
          step="0.01"
          placeholder="0.00"
        >

      </div>

      ${
        type==="room-service"
        ?
        `
        <p style="
          color:var(--muted);

          margin:10px 0 0;

        </p>

        :""
      }

          class="btn btn-outline"
          onclick="closeModal()"
        >

        </button>

        >
          Add charge
        </button>

      </div>

    `
  );
};

window.savePOSCharge=function(type){

  const stayId =
    document.getElementById("charge-stay")
      .value;

  const description =
    document.getElementById("charge-description")
      .value.trim();

  const amount =
    Number(
      document.getElementById("charge-amount")
        .value
    );

  if(!stayId || !description || amount<0){
    showToast("Complete the charge.");
    return;
  }

  if(
    type==="room-service" &&
    amount>500
  ){

    showToast(
      "Room service cannot exceed £500 Bloxburg cash."
    );

    return;
  }

  const stay =
    state.stays.find(
      s=>s.id===stayId
    );

  if(!stay) return;

  state.charges.unshift({
    id:uid("charge"),
    stayId,
    guestId:stay.guestId,
    category:type,
    description,
    amount,
    createdAt:today()
  });

  logActivity(
    "charge",
    `${description} added to ${stay.guestName}`
  );

  saveState();

  closeModal();
  renderApp();

  showToast("Charge added.");
};

  `;
}

/* ==================================================
   PROFILE MENU

window.openProfileMenu=function(){

      <div class="summary-row">
        <span>Username</span>
        <strong>
          @${escapeHTML(
            state.currentProfile?.username
          )}
        </strong>
      </div>

      <div class="summary-row">

          onclick="closeModal()"

/* ==================================================
   GUEST SEARCH
   ================================================== */

window.openGuestSearch=function(){

  openModal(
    "Search guests",
    `

      <div class="form-field">

        <label>Search by name</label>

        <input
          id="guest-search"
          placeholder="Guest name..."
          oninput="runGuestSearch()"
        >

      </div>

      <div
        id="guest-search-results"
        style="margin-top:14px"
      ></div>
    `
  );

  runGuestSearch();
};

window.runGuestSearch=function(){

  const input =
    document.getElementById("guest-search");

  const output =
    document.getElementById(
      "guest-search-results"
    );

  if(!input || !output) return;

  const query =
    input.value.trim().toLowerCase();

  const matches =
    state.guests.filter(
      g=>g.name.toLowerCase().includes(query)
    );

  output.innerHTML =
    matches.length
    ?
    `<div class="list">
      ${matches.map(g=>`

        <button
          class="list-item"
          onclick="closeModal();openGuest('${g.id}')"
        >

          <div class="list-main">
            <strong>
              ${escapeHTML(g.name)}
            </strong>
            <span>
              Guest record
            </span>
          </div>

          ${icons.arrow}

        </button>

      `).join("")}
    </div>`
    :
    `
      <div class="empty">
        <strong>No matches</strong>
        Try another name.
      </div>
    `;
};


/* ==================================================
   MODALS
   ================================================== */

function openModal(title,body){

  document.getElementById("modal-root")
    .innerHTML=`

      <div
        class="modal-layer"
        onclick="handleModalBackground(event)"
      >

        <section class="modal">

          <div class="modal-head">

            <h2>${title}</h2>

            <button
              class="icon-button"
              onclick="closeModal()"
            >
              ${icons.close}
            </button>

          </div>

          <div class="modal-body">
            ${body}
          </div>

        </section>

      </div>
    `;
}

window.handleModalBackground=function(event){

  if(
    event.target.classList.contains(
      "modal-layer"
    )
  ){
    closeModal();
  }
};

window.closeModal=function(){

  document.getElementById("modal-root")
    .innerHTML="";
};


/* ==================================================
   RESET / LOGOUT
   ================================================== */

window.logout=function(){

  state.currentProfile=null;

  saveState();

  renderLogin([]);

  loadProfiles();
};

window.resetLocalData=function(){

  const confirmed =
    confirm(
      "Reset all operational data on this device?"
    );

  if(!confirmed) return;

  const profile =
    state.currentProfile;

  localStorage.removeItem(
    "fawnwood_state"
  );

  state =
    structuredClone(defaultState);

  state.currentProfile=profile;

  saveState();

  renderApp();

  showToast(
    "Operational data reset."
  );
};


/* ==================================================
   INITIALISE
   ================================================== */

function init(){

  /*
    We deliberately do NOT show a Supabase
    connection-error popup.

    If Supabase cannot be reached, the login
    simply shows no profiles rather than
    interrupting the app with an error modal.
  */

  if(state.currentProfile){

    renderApp();

  }else{

    renderLogin([]);

    loadProfiles();

  }
}

init();

</script>
