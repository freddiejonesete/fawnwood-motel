<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fawnwood</title>

<style>
:root{
  --bg:#f6f7f5;
  --surface:#ffffff;
  --surface2:#f0f2ef;
  --text:#20251f;
  --muted:#747b72;
  --line:#e3e6e1;
  --accent:#6f8069;
  --accent-dark:#53634e;
  --danger:#b85d5d;
  --success:#668265;
  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  min-height:100vh;
}

/* =========================
   PROFILE SCREEN
========================= */

.profile-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px 18px;
  background:
    radial-gradient(circle at top,#ffffff 0%,#f6f7f5 55%,#eef1ec 100%);
}

.profile-container{
  width:100%;
  max-width:620px;
}

.brand{
  text-align:center;
  margin-bottom:34px;
}

.brand h1{
  margin:0;
  font-size:42px;
  letter-spacing:-2px;
  font-weight:800;
}

.brand p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:15px;
}

.profile-grid{
  display:grid;
  gap:12px;
}

.profile-card{
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.035);
  transition:.15s;
}

.profile-card:active{
  transform:scale(.985);
}

.avatar{
  width:48px;
  height:48px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:var(--accent);
  color:white;
  font-weight:800;
}

.profile-details{
  flex:1;
  min-width:0;
}

.profile-name{
  font-weight:750;
  font-size:16px;
}

.profile-roles{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.arrow{
  color:#a1a79f;
  font-size:25px;
}

.add-profile{
  width:100%;
  margin-top:14px;
  padding:15px;
  border-radius:16px;
  background:var(--text);
  color:white;
  font-weight:700;
}

.no-profiles{
  text-align:center;
  padding:32px 15px;
  color:var(--muted);
}

/* =========================
   APP LAYOUT
========================= */

.app{
  min-height:100vh;
}

.sidebar{
  display:none;
}

.mobile-header{
  height:62px;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
}

.mobile-logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-1px;
}

.mobile-avatar{
  width:35px;
  height:35px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:11px;
  background:var(--accent);
  color:white;
  font-size:12px;
  font-weight:800;
}

.main{
  max-width:1000px;
  margin:auto;
  padding:24px 17px 100px;
}

.page-title{
  margin-bottom:24px;
}

.page-title h1{
  margin:0;
  font-size:29px;
  letter-spacing:-1px;
}

.page-title p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:14px;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 3px 14px rgba(0,0,0,.025);
}

.welcome{
  padding:21px;
  margin-bottom:22px;
}

.welcome-label{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:700;
}

.welcome h2{
  margin:7px 0 4px;
  font-size:24px;
}

.welcome p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  padding:17px;
}

.stat-number{
  font-size:25px;
  font-weight:800;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* =========================
   SECTIONS
========================= */

.section{
  margin-top:27px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.section-title{
  font-size:17px;
  font-weight:750;
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.action{
  text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px;
}

.action-icon{
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:var(--surface2);
  margin-bottom:12px;
  font-size:17px;
}

.action b{
  display:block;
  font-size:14px;
}

.action small{
  display:block;
  color:var(--muted);
  margin-top:4px;
  font-size:12px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border-radius:11px;
  padding:10px 13px;
  font-size:13px;
  font-weight:700;
}

.btn-primary{
  background:var(--text);
  color:white;
}

.btn-secondary{
  background:var(--surface2);
  color:var(--text);
}

.btn-danger{
  background:#f8e8e8;
  color:var(--danger);
}

.btn-ghost{
  background:transparent;
  color:var(--accent-dark);
  padding:7px;
}

.btn-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* =========================
   LISTS
========================= */

.list{
  display:grid;
  gap:9px;
}

.list-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
  text-align:left;
}

.list-main{
  flex:1;
  min-width:0;
}

.list-title{
  font-size:14px;
  font-weight:700;
}

.list-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.pill{
  display:inline-block;
  background:var(--surface2);
  border-radius:20px;
  padding:4px 7px;
  font-size:10px;
  margin:2px 2px 0 0;
}

.pill.success{
  background:#e9f0e7;
  color:var(--success);
}

.menu-icon{
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:var(--surface2);
  flex:none;
}

.menu-arrow{
  color:#aaa;
  font-size:21px;
}

/* =========================
   SEARCH
========================= */

.search{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:14px;
  padding:13px 15px;
  outline:none;
  margin-bottom:14px;
}

.search:focus{
  border-color:var(--accent);
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:35px 20px;
  color:var(--muted);
}

.empty h2{
  color:var(--text);
  font-size:18px;
  margin:10px 0 5px;
}

.empty p{
  margin:0 auto 15px;
  max-width:330px;
  font-size:13px;
  line-height:1.5;
}

.empty-icon{
  font-size:28px;
}

/* =========================
   TASKS
========================= */

.task-row{
  display:flex;
  align-items:center;
  gap:11px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.task-row:last-child{
  border-bottom:0;
}

.check{
  width:24px;
  height:24px;
  flex:none;
  border:2px solid #ccd1ca;
  border-radius:7px;
  background:white;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.check.done{
  background:var(--accent);
  border-color:var(--accent);
}

.task-content{
  flex:1;
  min-width:0;
}

.task-title{
  font-size:14px;
  font-weight:700;
}

.task-done{
  text-decoration:line-through;
  color:#9aa097;
}

.task-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

/* =========================
   SHIFT
========================= */

.shift{
  padding:16px;
}

.shift-time{
  font-size:12px;
  color:var(--accent-dark);
  font-weight:700;
}

.shift-name{
  margin-top:7px;
  font-weight:750;
}

.shift-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* =========================
   ANNOUNCEMENTS
========================= */

.notice{
  padding:17px;
}

.notice-title{
  font-weight:750;
  font-size:16px;
}

.notice-body{
  margin-top:7px;
  line-height:1.5;
  font-size:13px;
  white-space:pre-wrap;
}

.notice-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:11px;
}

/* =========================
   MENU
========================= */

.menu-list{
  display:grid;
  gap:9px;
}

.menu-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
}

.menu-item > div:nth-child(2){
  flex:1;
}

.menu-item b{
  display:block;
  font-size:14px;
}

.menu-item small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-button{
  background:transparent;
  color:#8b9189;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.nav-button .nav-icon{
  font-size:18px;
}

.nav-button.active{
  color:var(--accent-dark);
  font-weight:700;
}

/* =========================
   MODAL
========================= */

.modal-root{
  position:relative;
  z-index:100;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,25,20,.42);
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding:0;
}

.modal{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:23px 23px 0 0;
  padding:22px 18px;
}

.modal h2{
  margin:0;
  font-size:21px;
}

.modal > p{
  color:var(--muted);
  font-size:13px;
  margin:6px 0 20px;
}

.form-grid{
  display:grid;
  gap:15px;
}

.form-grid.two{
  grid-template-columns:1fr;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.input,
.select,
.textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fafbfa;
  border-radius:12px;
  padding:12px;
  outline:none;
}

.textarea{
  min-height:100px;
  resize:vertical;
}

.role-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.role-choice{
  background:var(--surface2);
  border:1px solid transparent;
  border-radius:10px;
  padding:10px 8px;
  font-size:11px;
  text-align:left;
}

.role-choice.selected{
  background:#e7ede4;
  border-color:var(--accent);
  color:var(--accent-dark);
  font-weight:700;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:22px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(15px);
  background:#20251f;
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:800px){

  .mobile-header{
    display:none;
  }

  .sidebar{
    display:flex;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:235px;
    background:white;
    border-right:1px solid var(--line);
    flex-direction:column;
    padding:25px 14px;
    z-index:20;
  }

  .sidebar-logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
    padding:0 10px 28px;
  }

  .side-nav{
    display:grid;
    gap:4px;
  }

  .side-button{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:11px 12px;
    border-radius:11px;
    background:transparent;
    color:var(--muted);
    text-align:left;
    font-size:13px;
    font-weight:600;
  }

  .side-button.active{
    background:var(--surface2);
    color:var(--text);
  }

  .side-bottom{
    margin-top:auto;
  }

  .main{
    margin-left:235px;
    padding:38px 40px 50px;
    max-width:1235px;
  }

  .bottom-nav{
    display:none;
  }

  .stats{
    grid-template-columns:repeat(4,1fr);
  }

  .actions{
    grid-template-columns:repeat(4,1fr);
  }

  .form-grid.two{
    grid-template-columns:1fr 1fr;
  }

  .modal-backdrop{
    align-items:center;
    padding:20px;
  }

  .modal{
    border-radius:22px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modalRoot"></div>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   FAWNWOOD
   Single-file application
========================================================= */

const STORAGE_KEY = "fawnwood_app_v2";


const ROLES = [
  "Reception",
  "Housekeeping",
  "Management",
  "Concierge",
  "Food & Beverage",
  "Maintenance",
  "Security",
  "Events"
];


const DEFAULT_DEPARTMENTS = [
  "Front Office",
  "Housekeeping",
  "Food & Beverage",
  "Concierge",
  "Management",
  "Maintenance",
  "Security",
  "Events"
];


let state = loadState();

let currentPage = "home";

let search = "";


/* =========================================================
   STATE
========================================================= */

function loadState(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    if(saved){

      return {
        profiles:saved.profiles || [],
        currentUser:saved.currentUser || null,
        departments:
          saved.departments ||
          DEFAULT_DEPARTMENTS,
        shifts:saved.shifts || [],
        tasks:saved.tasks || [],
        announcements:
          saved.announcements || []
      };

    }

  }catch(error){

    console.error(error);

  }


  return {
    profiles:[],
    currentUser:null,
    departments:DEFAULT_DEPARTMENTS,
    shifts:[],
    tasks:[],
    announcements:[]
  };

}


function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================================================
   HELPERS
========================================================= */

function id(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


function escapeHTML(value=""){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function initials(name){

  return name
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase() || "?";

}


function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function formatDate(date){

  if(!date) return "No date";

  return new Date(
    date + "T12:00:00"
  ).toLocaleDateString(
    undefined,
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  );

}


function currentUser(){

  return state.profiles.find(
    p => p.id === state.currentUser
  );

}


function toast(message){

  const element =
    document.getElementById("toast");

  element.textContent = message;

  element.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      ()=>{
        element.classList.remove("show");
      },
      2200
    );

}


function closeModal(){

  document.getElementById(
    "modalRoot"
  ).innerHTML = "";

}


function modal(content){

  document.getElementById(
    "modalRoot"
  ).innerHTML = `
    <div
      class="modal-backdrop"
      onclick="
        if(event.target===this)
          closeModal()
      "
    >
      <div class="modal">
        ${content}
      </div>
    </div>
  `;

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  const app =
    document.getElementById("app");

  /*
    PROFILE SCREEN ALWAYS COMES FIRST.
  */

  if(!currentUser()){

    app.innerHTML =
      profileScreen();

    return;

  }


  app.innerHTML =
    appShell();

  renderPage();

}


/* =========================================================
   PROFILE SCREEN
========================================================= */

function profileScreen(){

  let profiles = "";

  if(state.profiles.length === 0){

    profiles = `
      <div class="no-profiles">

        <div style="font-size:30px">
          ♙
        </div>

        <h3 style="color:var(--text)">
          No profiles yet
        </h3>

        <p>
          Create a profile to enter
          the Fawnwood application.
        </p>

      </div>
    `;

  }else{

    profiles = `
      <div class="profile-grid">

        ${state.profiles.map(
          profile => `

            <button
              class="profile-card"
              onclick="
                login('${profile.id}')
              "
            >

              <div class="avatar">
                ${initials(profile.name)}
              </div>

              <div class="profile-details">

                <div class="profile-name">
                  ${escapeHTML(profile.name)}
                </div>

                <div class="profile-roles">
                  ${profile.roles
                    .map(escapeHTML)
                    .join(" · ")}
                </div>

              </div>

              <div class="arrow">
                ›
              </div>

            </button>

          `
        ).join("")}

      </div>
    `;

  }


  return `
    <section class="profile-screen">

      <div class="profile-container">

        <div class="brand">

          <h1>fawnwood</h1>

          <p>
            Select a profile to continue
          </p>

        </div>

        ${profiles}

        <button
          class="add-profile"
          onclick="
            openProfileModal()
          "
        >
          + Add profile
        </button>

      </div>

    </section>
  `;

}


function login(profileId){

  state.currentUser =
    profileId;

  save();

  currentPage =
    "home";

  render();

  toast("Welcome back.");

}


function logout(){

  state.currentUser = null;

  save();

  currentPage =
    "home";

  render();

}


/* =========================================================
   PROFILE MODAL
========================================================= */

function openProfileModal(
  profileId = null
){

  const profile =
    profileId
      ? state.profiles.find(
          p => p.id === profileId
        )
      : {
          name:"",
          roles:[],
          department:
            state.departments[0],
          status:"Active",
          notes:""
        };


  if(!profile) return;


  modal(`

    <h2>
      ${
        profileId
          ? "Edit profile"
          : "Create profile"
      }
    </h2>

    <p>
      ${
        profileId
          ? "Update this staff profile."
          : "Set up a profile for a Fawnwood user."
      }
    </p>


    <div class="form-grid">

      <div class="field">

        <label>
          Name
        </label>

        <input
          id="profileName"
          class="input"
          placeholder="Full name"
          value="${escapeHTML(profile.name)}"
        >

      </div>


      <div class="field">

        <label>

function saveProfile(profileId){

  const name =
    document
      .getElementById("profileName")
      .value
      .trim();


  const roles =
    [
      ...document.querySelectorAll(
        ".role-choice.selected"
      )
    ]
    .map(
      button =>
        button.textContent.trim()
    );


  if(!name){

    toast("Enter a name.");

    return;

  }


  if(roles.length === 0){

    toast(
      "Choose at least one job role."
    );

    return;

  }


  const profile = {

    id:
      profileId ||
      id(),

    name,

    roles,

    department:
      document
        .getElementById(
          "profileDepartment"
        )
        .value,

    status:
      document
        .getElementById(
          "profileStatus"
        )
        .value,

    notes:
      document
        .getElementById(
          "profileNotes"
        )
        .value
        .trim()

  };


  if(profileId){

    const index =
      state.profiles.findIndex(
        p => p.id === profileId
      );

    if(index !== -1){

      state.profiles[index] =
        profile;

    }

    toast("Profile updated.");

  }else{

    state.profiles.push(profile);

    toast("Profile created.");

  }


  save();

  closeModal();

  render();

}


function deleteProfile(profileId){

  if(
    !confirm(
      "Delete this profile?"
    )
  ) return;


  state.profiles =
    state.profiles.filter(
      p => p.id !== profileId
    );


  if(
    state.currentUser ===
    profileId
  ){

    state.currentUser =
      null;

  }


  save();

  closeModal();

  render();

  toast("Profile deleted.");

}

function saveShift(shiftId){

  const newShift = {

    id:
      shiftId ||
      id(),

    date:
      document.getElementById(
        "shiftDate"
      ).value,

    start:
      document.getElementById(
        "shiftStart"
      ).value,

    end:
      document.getElementById(
        "shiftEnd"
      ).value,

    userId:
      document.getElementById(
        "shiftUser"
      ).value,

    role:
      document.getElementById(
        "shiftRole"
      ).value,

    department:
      document.getElementById(
        "shiftDepartment"
      ).value

  };


  if(!newShift.date){

    toast("Choose a date.");

    return;

  }


  if(shiftId){

    const index =
      state.shifts.findIndex(
        s => s.id === shiftId
      );

    if(index !== -1){

      state.shifts[index] =
        newShift;

    }

    toast("Shift updated.");

  }else{

    state.shifts.push(
      newShift
    );

    toast("Shift added.");

  }


  save();

  closeModal();

  render();

}


function deleteShift(shiftId){

  if(
    !confirm(
      "Delete this shift?"
    )
  ) return;


  state.shifts =
    state.shifts.filter(
      s => s.id !== shiftId
    );


  save();

  render();

  toast("Shift deleted.");

}

                    profile.name

        onclick="closeModal()"

          saveTask(

          )
        "

        ${taskId
          ? "Save"

    </div>


    ${

                )

          </div>
        `
        : ""
    }

  `);

}


function saveTask(taskId){

  const title =
    document.getElementById(
      "taskTitle"
    ).value.trim();


  if(!title){

    toast("Enter a task.");

    return;

  }


  const old =
    taskId
      ? state.tasks.find(
          t => t.id === taskId
        )
      : null;


  const task = {

    id:
      taskId ||
      id(),

    title,

    priority:
      document.getElementById(
        "taskPriority"
      ).value,

    due:
      document.getElementById(
        "taskDue"
      ).value,

    userId:
      document.getElementById(
        "taskUser"
      ).value,

    department:
      document.getElementById(
        "taskDepartment"
      ).value,

    notes:
      document.getElementById(
        "taskNotes"
      ).value.trim(),

    done:
      old
        ? old.done
        : false

  };


  if(taskId){

    const index =
      state.tasks.findIndex(
        t => t.id === taskId
      );

    if(index !== -1){

      state.tasks[index] =
        task;

    }

    toast("Task updated.");

  }else{

    state.tasks.push(task);

    toast("Task created.");

  }


  save();

  closeModal();

  render();

}


function toggleTask(taskId){

  const task =
    state.tasks.find(
      t => t.id === taskId
    );


  if(!task) return;


  task.done =
    !task.done;


  save();

  renderPage();

  toast(
    task.done
      ? "Task completed."
      : "Task reopened."
  );

}


function deleteTask(taskId){

  if(
    !confirm(
      "Delete this task?"
    )
  ) return;


  state.tasks =
    state.tasks.filter(
      t => t.id !== taskId
    );


  save();

  closeModal();

  render();

  toast("Task deleted.");

}

function openDepartmentModal(
  oldName=""
){

  modal(`

          : "Add department"
      }
    </h2>

    <p>
      Departments organise
      staff and hotel operations.
    </p>


    <div class="field">

      <label>
        Department name
      </label>

      <input
        id="departmentName"
        class="input"
        placeholder="e.g. Spa"
        value="${escapeHTML(oldName)}"
      >

    </div>

      <button
        class="btn btn-secondary"
        onclick="closeModal()"
      >
        Cancel

            '${escapeHTML(oldName)}'
          )

function saveDepartment(oldName){

  const newName =
    document
      .getElementById(
        "departmentName"
      )
      .value
      .trim();


  if(!newName){

    toast(
      "Enter a department name."
    );

    return;

  }


  if(
    state.departments.includes(
      newName
    ) &&
    newName !== oldName
  ){

    toast(
      "That department already exists."
    );

    return;

  }


  if(oldName){

    const index =
      state.departments.indexOf(
        oldName
      );


    if(index !== -1){

      state.departments[index] =
        newName;

    }


    state.profiles.forEach(
      profile => {

        if(
          profile.department ===
          oldName
        ){

          profile.department =
            newName;

        }

      }
    );


    state.shifts.forEach(
      shift => {

        if(
          shift.department ===
          oldName
        ){

          shift.department =
            newName;

        }

      }
    );


    state.tasks.forEach(
      task => {

        if(
          task.department ===
          oldName
        ){

          task.department =
            newName;

        }

      }
    );

  }else{

    state.departments.push(
      newName
    );

  }


  save();

  closeModal();

  render();

  toast("Department saved.");

}

function saveAnnouncement(
  announcementId
){

  const title =
    document
      .getElementById(
        "announcementTitle"
      )
      .value
      .trim();


  const body =
    document
      .getElementById(
        "announcementBody"
      )
      .value
      .trim();


  if(!title || !body){

    toast(
      "Add a title and message."
    );

    return;

  }


  const announcement = {

    id:
      announcementId ||
      id(),

    title,

    body,

    department:
      document
        .getElementById(
          "announcementDepartment"
        )
        .value,

    date:
      today()

  };


  if(announcementId){

    const index =
      state.announcements.findIndex(
        a =>
          a.id ===
          announcementId
      );


    if(index !== -1){

      state.announcements[index] =
        announcement;

    }

    toast(
      "Announcement updated."
    );

  }else{

    state.announcements.push(
      announcement
    );

    toast(
      "Announcement published."
    );

  }


  save();

  closeModal();

  render();

}


function deleteAnnouncement(
  announcementId
){

  if(

  state.announcements =
    state.announcements.filter(
      a =>
        a.id !==
        announcementId

  save();

  render();

  toast(
    "Announcement deleted."
  );

}

/* =========================================================
   DATA MANAGEMENT
========================================================= */

function exportData(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          state,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    "fawnwood-backup.json";

  link.click();


  URL.revokeObjectURL(
    url
  );


  toast(
    "Backup exported."
  );

}


function resetData(){

  if(
    !confirm(
      "This will delete all Fawnwood data stored in this browser. Continue?"
    )
  ) return;


  localStorage.removeItem(
    STORAGE_KEY
  );


  location.reload();

}
